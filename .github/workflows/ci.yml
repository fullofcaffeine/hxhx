name: CI / Core PR Checks

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      qa_tier:
        description: Minimum QA tier to run for this exact commit
        required: true
        default: Q3
        type: choice
        options:
          - Q3
          - Q4

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: '20'
  HAXE_VERSION: '4.3.7'

jobs:
  route:
    name: QA risk route
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
      run_q1: ${{ steps.classify.outputs.run_q1 }}
      run_q2: ${{ steps.classify.outputs.run_q2 }}
      run_q3: ${{ steps.classify.outputs.run_q3 }}
      run_authentic_compiler: ${{ steps.classify.outputs.run_authentic_compiler }}
      run_q4: ${{ steps.classify.outputs.run_q4 }}
      policy_sha256: ${{ steps.classify.outputs.policy_sha256 }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run cheap routing and documentation guards
        run: |
          set -euo pipefail
          node --check scripts/ci/qa-risk-change-inventory.js
          node scripts/ci/qa-risk-change-inventory-fixture-test.js
          node --check scripts/ci/qa-risk-classifier.js
          node scripts/ci/qa-risk-classifier-fixture-test.js
          node scripts/ci/qa-risk-workflow-contract-check.js
          node scripts/ci/no-legacy-target-docs-check.js
          node scripts/ci/promotion-matrix-docs-check.js
          node scripts/ci/native-iteration-latency-contract-check.js
          node scripts/ci/local-path-check.js
      - name: Inventory immutable changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QA_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/qa-routing
          changed_paths=.artifacts/qa-routing/changed-files.txt
          node scripts/ci/qa-risk-change-inventory.js \
            --event "$QA_EVENT_NAME" \
            --event-base-sha "${BASE_SHA:-}" \
            --head-sha "$HEAD_SHA" \
            --paths-output "$changed_paths" \
            --metadata-output .artifacts/qa-routing/change-inventory.json
          echo "QA routing changed-path count: $(wc -l < "$changed_paths" | tr -d ' ')"
      - name: Classify QA risk
        id: classify
        env:
          QA_EVENT_NAME: ${{ github.event_name }}
          QA_PRODUCER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QA_REQUESTED_TIER: ${{ inputs.qa_tier || 'auto' }}
          QA_REPOSITORY: ${{ github.repository }}
          QA_RUN_ATTEMPT: ${{ github.run_attempt }}
          QA_RUN_ID: ${{ github.run_id }}
          QA_WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          node scripts/ci/qa-risk-classifier.js \
            --event "$QA_EVENT_NAME" \
            --paths-file .artifacts/qa-routing/changed-files.txt \
            --requested-tier "$QA_REQUESTED_TIER" \
            --producer-sha "$QA_PRODUCER_SHA" \
            --inventory-file .artifacts/qa-routing/change-inventory.json \
            --repository "$QA_REPOSITORY" \
            --workflow "$QA_WORKFLOW" \
            --run-id "$QA_RUN_ID" \
            --run-attempt "$QA_RUN_ATTEMPT" \
            --output .artifacts/qa-routing/classification.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Summarize QA route
        run: |
          {
            echo "### QA risk route"
            echo "- Tier: \`${{ steps.classify.outputs.tier }}\`"
            echo "- Policy SHA-256: \`${{ steps.classify.outputs.policy_sha256 }}\`"
            echo "- Reason: ${{ steps.classify.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload QA routing receipt
        uses: actions/upload-artifact@v4
        with:
          name: qa-risk-route-${{ github.sha }}
          path: .artifacts/qa-routing
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          version="8.21.2"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Run gitleaks (all history)
        run: |
          set -euo pipefail
          bash scripts/ci/gitleaks-history-check.sh

  guards:
    name: Guardrails
    runs-on: ubuntu-latest
    needs: [route]
    if: ${{ needs.route.outputs.run_q1 == 'true' }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install OCaml toolchain for connect-retry smoke
        run: |
          set -euo pipefail
          retry_apt() {
            local max_attempts=4
            local attempt=1
            while true; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "APT command failed after ${attempt} attempts: $*" >&2
                return 1
              fi
              echo "APT command failed (attempt ${attempt}/${max_attempts}): $*" >&2
              attempt=$((attempt + 1))
              sleep 5
            done
          }

          retry_apt sudo apt-get update

          dune_candidate="$(apt-cache policy dune | awk '/Candidate:/ { print $2; exit }')"
          if [ -n "${dune_candidate:-}" ] && [ "${dune_candidate}" != "(none)" ]; then
            dune_pkg="dune"
          else
            dune_pkg="ocaml-dune"
          fi

          retry_apt sudo apt-get install -y ocaml ocaml-findlib "${dune_pkg}"
          dune --version
          ocamlc -version
          ocamlfind ocamlc -version
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v4
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-
      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          npx lix download
          npx lix download haxe "${{ env.HAXE_VERSION }}"
          npx lix use haxe "${{ env.HAXE_VERSION }}"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version
      - name: Install formatter haxelib
        run: |
          set -euo pipefail
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          if ! haxelib run formatter --help >/dev/null 2>&1; then
            haxelib install formatter --quiet
          fi
      - name: Run guardrails
        run: npm run ci:guards
      - name: Prove standalone reflaxe.ocaml package install
        run: npm run test:reflaxe-ocaml:package-install
      - name: Upload standalone reflaxe.ocaml package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reflaxe-ocaml-package-install-${{ runner.os }}-${{ github.sha }}
          path: .artifacts/reflaxe-ocaml/package-install
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Validate build-hxhx connect retry smoke
        run: npm run test:hxhx:build-connect-retry-smoke
      - name: Validate build-hxhx server worker smoke
        run: npm run test:hxhx:build-connect-worker-smoke
      - name: Validate supported Reflaxe warm-server routing
        run: npm run test:hxhx:reflaxe-server-routing
      - name: Validate hxhx direct-flag CLI contract
        run: npm run test:hxhx:cli-contract

  stage0-free-smoke:
    name: Stage0-free smoke
    runs-on: ubuntu-latest
    needs: [route, guards]
    if: ${{ needs.route.outputs.run_q2 == 'true' && needs.guards.result == 'success' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup OCaml toolchain (OCaml 5.2.1)
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.1
          dune-cache: true
      - name: Install OCaml packages
        run: |
          set -euo pipefail
          eval "$(opam env)"
          opam install -y dune ocamlfind
          eval "$(opam env)"
          dune --version
          ocamlc -version
      - name: Export OCaml switch binaries to PATH
        run: |
          set -euo pipefail
          eval "$(opam env)"
          echo "${OPAM_SWITCH_PREFIX}/bin" >> "$GITHUB_PATH"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v4
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-
      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          npx lix download
          npx lix download haxe "${{ env.HAXE_VERSION }}"
          npx lix use haxe "${{ env.HAXE_VERSION }}"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version
      - name: Download Haxe libraries (lix)
        run: npx lix download
      - name: Build and run stage0-free smoke
        run: |
          set -euo pipefail
          bash scripts/hxhx/check-stage0-policy.sh release
      - name: Emit stage0-free marker
        run: echo "STAGE0_FREE_SMOKE:PASS"

  js-native-smoke:
    name: JS-native smoke
    runs-on: ubuntu-latest
    needs: [route, guards]
    if: ${{ needs.route.outputs.run_q2 == 'true' && needs.guards.result == 'success' }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup OCaml toolchain (OCaml 5.2.1)
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.1
          dune-cache: true
      - name: Install OCaml packages
        run: |
          set -euo pipefail
          eval "$(opam env)"
          opam install -y dune ocamlfind
          eval "$(opam env)"
          dune --version
          ocamlc -version
      - name: Export OCaml switch binaries to PATH
        run: |
          set -euo pipefail
          eval "$(opam env)"
          echo "${OPAM_SWITCH_PREFIX}/bin" >> "$GITHUB_PATH"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v4
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-
      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          npx lix download
          npx lix download haxe "${{ env.HAXE_VERSION }}"
          npx lix use haxe "${{ env.HAXE_VERSION }}"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version
      - name: Download Haxe libraries (lix)
        run: npx lix download
      - name: Build hxhx once (shared for smoke + oracle subset)
        run: |
          set -euo pipefail
          HXHX_BIN="$(bash scripts/hxhx/build-hxhx.sh | tail -n 1)"
          if [ -z "$HXHX_BIN" ] || [ ! -f "$HXHX_BIN" ]; then
            echo "Failed to build hxhx binary for JS smoke lanes." >&2
            exit 1
          fi
          echo "HXHX_BIN=$HXHX_BIN" >> "$GITHUB_ENV"
      - name: Run js-native emit+run smoke
        env:
          HXHX_BIN: ${{ env.HXHX_BIN }}
          HXHX_BUILTIN_SMOKE_OCAML: "0"
          HXHX_BUILTIN_SMOKE_JS_NATIVE: "1"
          HXHX_BUILTIN_SMOKE_REQUIRE_JS_NATIVE: "1"
        run: |
          set -euo pipefail
          echo "HXHX_BIN=${HXHX_BIN}"
          echo "HXHX_BUILTIN_SMOKE_OCAML=${HXHX_BUILTIN_SMOKE_OCAML}"
          echo "HXHX_BUILTIN_SMOKE_JS_NATIVE=${HXHX_BUILTIN_SMOKE_JS_NATIVE}"
          echo "HXHX_BUILTIN_SMOKE_REQUIRE_JS_NATIVE=${HXHX_BUILTIN_SMOKE_REQUIRE_JS_NATIVE}"
          npm run test:hxhx:builtin-target-smoke
      - name: Run JS oracle smoke (CI subset)
        env:
          HXHX_BIN: ${{ env.HXHX_BIN }}
          HXHX_JS_ORACLE_FIXTURES: "JsOracleLoopMain,JsOracleSwitchExprMain,JsOracleTryCatchMain,JsOracleRangeExprMain,JsOracleNewArrayMain,JsOracleMultiCatchMain"
        run: |
          set -euo pipefail
          echo "HXHX_BIN=${HXHX_BIN}"
          echo "HXHX_JS_ORACLE_FIXTURES=${HXHX_JS_ORACLE_FIXTURES}"
          npm run test:upstream:js-oracle-smoke
      - name: Emit js-native marker
        run: echo "JS_NATIVE_SMOKE:PASS"

  plugin-matrix:
    name: Plugin matrix (strict)
    runs-on: ubuntu-latest
    needs: [route, guards]
    if: ${{ needs.route.outputs.run_q2 == 'true' && needs.guards.result == 'success' }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup OCaml toolchain (OCaml 5.2.1)
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.1
          dune-cache: true
      - name: Install OCaml packages
        run: |
          set -euo pipefail
          eval "$(opam env)"
          opam install -y dune ocamlfind
          eval "$(opam env)"
          dune --version
          ocamlc -version
      - name: Export OCaml switch binaries to PATH
        run: |
          set -euo pipefail
          eval "$(opam env)"
          echo "${OPAM_SWITCH_PREFIX}/bin" >> "$GITHUB_PATH"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v4
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-
      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          npx lix download
          npx lix download haxe "${{ env.HAXE_VERSION }}"
          npx lix use haxe "${{ env.HAXE_VERSION }}"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version
      - name: Download Haxe libraries (lix)
        run: npx lix download
      - name: Build hxhx once (shared for plugin matrix + happy path)
        run: |
          set -euo pipefail
          HXHX_BIN="$(bash scripts/hxhx/build-hxhx.sh | tail -n 1)"
          if [ -z "$HXHX_BIN" ] || [ ! -f "$HXHX_BIN" ]; then
            echo "Failed to build hxhx binary for plugin matrix lanes." >&2
            exit 1
          fi
          echo "HXHX_BIN=$HXHX_BIN" >> "$GITHUB_ENV"
      - name: Run strict plugin matrix
        env:
          HXHX_PLUGIN_MATRIX_STRICT: "1"
          HXHX_BIN: ${{ env.HXHX_BIN }}
        run: |
          set -euo pipefail
          npm run -s test:plugins:strict-matrix
      - name: Run auditable native plugin happy path
        env:
          HXHX_BIN: ${{ env.HXHX_BIN }}
        run: |
          set -euo pipefail
          npm run -s test:hxhx:native-plugin-happy-path
      - name: Emit plugin matrix marker
        run: echo "PLUGIN_MATRIX_STRICT:PASS"

  test-shards:
    name: Tests / ${{ matrix.label }}
    runs-on: ubuntu-latest
    needs: [route, guards]
    if: ${{ needs.route.outputs.run_q2 == 'true' && needs.guards.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: compiler
            label: Compiler and focused regressions
          - shard: macro-host-integration
            label: Macro-host integration
          - shard: target-packages
            label: Portable, snapshots, and examples
    # Q2 keeps the three bounded compiler/target families. The large hxhx
    # application workload has its own Q3 job below.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup OCaml toolchain (OCaml 5.2.1)
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.1
          dune-cache: true
      - name: Install OCaml packages
        run: |
          set -euo pipefail
          eval "$(opam env)"
          opam install -y dune ocamlfind
          eval "$(opam env)"
          dune --version
          ocamlc -version
      - name: Export OCaml switch binaries to PATH
        run: |
          set -euo pipefail
          eval "$(opam env)"
          echo "${OPAM_SWITCH_PREFIX}/bin" >> "$GITHUB_PATH"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v4
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-
      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          # `npm ci --ignore-scripts` skips postinstall; fetch the toolchain explicitly (incl. neko).
          npx lix download
          npx lix download haxe "${{ env.HAXE_VERSION }}"
          npx lix use haxe "${{ env.HAXE_VERSION }}"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version
      - name: Download Haxe libraries (lix)
        run: npx lix download
      - name: Run test shard
        env:
          HXHX_FORCE_STAGE0: "0"
          HXHX_STAGE0_HEARTBEAT: "30"
          HXHX_STAGE0_FAILFAST_SECS: "7200"
        run: npm run test:ci:shard -- --shard "${{ matrix.shard }}"
      - name: Upload shared macro-host evidence
        if: ${{ always() && matrix.shard == 'macro-host-integration' }}
        uses: actions/upload-artifact@v4
        with:
          name: core-macro-host-reuse-evidence-${{ github.sha }}
          path: .artifacts/core-test/macro-host-integration
          if-no-files-found: error
          retention-days: 14

  hxhx-e2e:
    name: Tests / hxhx target end-to-end
    runs-on: ubuntu-latest
    needs: [route, guards]
    if: ${{ needs.route.outputs.run_q3 == 'true' && needs.guards.result == 'success' }}
    # This one serialized application workload measured about 24 minutes on a
    # hosted runner. Reserve it for Q3 while retaining normal setup headroom.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup OCaml toolchain (OCaml 5.2.1)
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.1
          dune-cache: true
      - name: Install OCaml packages
        run: |
          set -euo pipefail
          eval "$(opam env)"
          opam install -y dune ocamlfind
          eval "$(opam env)"
          dune --version
          ocamlc -version
      - name: Export OCaml switch binaries to PATH
        run: |
          set -euo pipefail
          eval "$(opam env)"
          echo "${OPAM_SWITCH_PREFIX}/bin" >> "$GITHUB_PATH"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v4
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-
      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          npx lix download
          npx lix download haxe "${{ env.HAXE_VERSION }}"
          npx lix use haxe "${{ env.HAXE_VERSION }}"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version
      - name: Download Haxe libraries (lix)
        run: npx lix download
      - name: Run hxhx target end-to-end shard
        env:
          HXHX_FORCE_STAGE0: "0"
          HXHX_STAGE0_HEARTBEAT: "30"
          HXHX_STAGE0_FAILFAST_SECS: "7200"
        run: npm run test:ci:shard -- --shard hxhx-targets

  test:
    name: Tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [route, secret-scan, guards, stage0-free-smoke, js-native-smoke, plugin-matrix, test-shards, hxhx-e2e]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify every Core Tests prerequisite
        env:
          CORE_TEST_NEEDS_JSON: ${{ toJSON(needs) }}
          CORE_TEST_QA_TIER: ${{ needs.route.outputs.tier }}
        run: node scripts/ci/core-test-aggregate.js
