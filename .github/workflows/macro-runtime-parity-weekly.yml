name: Macro Runtime Parity (Weekly)

on:
  workflow_call:
    outputs:
      macro_runtime_parity_weekly_marker:
        description: "Weekly parity marker emitted when both runtime modes pass."
        value: ${{ jobs.macro-runtime-parity-summary.outputs.macro_runtime_parity_weekly_marker }}
      full1_macro_parity_marker:
        description: "Full1 macro parity marker emitted when both runtime modes pass."
        value: ${{ jobs.macro-runtime-parity-summary.outputs.full1_macro_parity_marker }}
  schedule:
    - cron: '40 7 * * 1'
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: macro-runtime-parity-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  HAXE_VERSION: '4.3.7'

jobs:
  macro-runtime-parity:
    name: Macro runtime parity (${{ matrix.macro_runtime_mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        macro_runtime_mode: [external-host, inproc]
    env:
      HXHX_MACRO_RUNTIME_MODE: ${{ matrix.macro_runtime_mode }}
      HXHX_GATE2_SKIP_PARTY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host toolchains (OCaml + Python)
        run: |
          set -euo pipefail
          retry_apt() {
            local max_attempts=4
            local attempt=1
            while true; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "APT command failed after ${attempt} attempts: $*" >&2
                return 1
              fi
              echo "APT command failed (attempt ${attempt}/${max_attempts}): $*" >&2
              attempt=$((attempt + 1))
              sleep 5
            done
          }
          retry_apt sudo apt-get update
          dune_candidate="$(apt-cache policy dune | awk '/Candidate:/ { print $2; exit }')"
          if [ -n "${dune_candidate:-}" ] && [ "${dune_candidate}" != "(none)" ]; then
            dune_pkg="dune"
          else
            dune_pkg="ocaml-dune"
          fi
          retry_apt sudo apt-get install -y \
            ocaml "${dune_pkg}" ocaml-findlib \
            python3
          dune --version
          ocamlc -version
          python3 --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v4
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          npx lix download
          npx lix download haxe "${{ env.HAXE_VERSION }}"
          npx lix use haxe "${{ env.HAXE_VERSION }}"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version

      - name: Download Haxe libraries (lix)
        run: npx lix download

      - name: Fetch upstream Haxe checkout (vendor/haxe)
        run: bash scripts/vendor/fetch-haxe-upstream.sh

      - name: Derive mode marker suffix
        run: |
          set -euo pipefail
          marker="${HXHX_MACRO_RUNTIME_MODE^^}"
          marker="${marker//-/_}"
          echo "HXHX_MODE_MARKER=$marker" >> "$GITHUB_ENV"
          artifact_dir=".artifacts/macro-runtime-parity/${HXHX_MACRO_RUNTIME_MODE}"
          echo "HXHX_PARITY_ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          mkdir -p "$artifact_dir"
          {
            echo "macro_runtime_mode=${HXHX_MACRO_RUNTIME_MODE}"
            echo "marker_suffix=${marker}"
          } > "$artifact_dir/meta.txt"

      - name: Build hxhx once for this mode
        run: |
          set -euo pipefail
          HXHX_BIN="$(bash scripts/hxhx/build-hxhx.sh | tail -n 1)"
          if [ -z "$HXHX_BIN" ] || [ ! -f "$HXHX_BIN" ]; then
            echo "Failed to build hxhx binary for macro runtime parity lane." >&2
            exit 1
          fi
          echo "HXHX_BIN=$HXHX_BIN" >> "$GITHUB_ENV"

      - name: Run upstream unit macro (stage3 no-emit)
        run: |
          set -euo pipefail
          artifact_dir="${HXHX_PARITY_ARTIFACT_DIR}"
          npm run test:upstream:unit-macro-stage3-no-emit 2>&1 | tee "$artifact_dir/unit-macro-stage3-no-emit.log"
          echo "MACRO_RUNTIME_PARITY_UNIT_${HXHX_MODE_MARKER}:PASS" | tee -a "$artifact_dir/markers.txt"

      - name: Run upstream runci macro workload (stage3 no-emit)
        run: |
          set -euo pipefail
          artifact_dir="${HXHX_PARITY_ARTIFACT_DIR}"
          npm run test:upstream:runci-macro-stage3-no-emit 2>&1 | tee "$artifact_dir/runci-macro-stage3-no-emit.log"
          echo "MACRO_RUNTIME_PARITY_RUNCI_${HXHX_MODE_MARKER}:PASS" | tee -a "$artifact_dir/markers.txt"

      - name: Run display + macro protocol checks
        run: |
          set -euo pipefail
          artifact_dir="${HXHX_PARITY_ARTIFACT_DIR}"
          npm run test:upstream:display-stage3-no-emit 2>&1 | tee "$artifact_dir/display-stage3-no-emit.log"
          npm run test:m14:macro-runtime-mode-switch 2>&1 | tee "$artifact_dir/m14-macro-runtime-mode-switch.log"
          echo "MACRO_RUNTIME_PARITY_DISPLAY_PROTOCOL_${HXHX_MODE_MARKER}:PASS" | tee -a "$artifact_dir/markers.txt"

      - name: Attach parity blockers list and emit mode marker
        run: |
          set -euo pipefail
          artifact_dir="${HXHX_PARITY_ARTIFACT_DIR}"
          cp docs/00-project/MACRO_RUNTIME_PARITY_BLOCKERS.md "$artifact_dir/macro-runtime-parity-blockers.md"
          echo "MACRO_RUNTIME_PARITY_BLOCKERS_${HXHX_MODE_MARKER}:TRACKED" | tee -a "$artifact_dir/markers.txt"
          echo "MACRO_RUNTIME_PARITY_${HXHX_MODE_MARKER}:PASS" | tee -a "$artifact_dir/markers.txt"

      - name: Upload parity artifacts (mode-tagged)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-runtime-parity-${{ matrix.macro_runtime_mode }}-${{ github.run_id }}
          path: .artifacts/macro-runtime-parity/${{ matrix.macro_runtime_mode }}
          if-no-files-found: warn

  macro-runtime-parity-summary:
    name: Macro runtime parity summary
    runs-on: ubuntu-latest
    needs: [macro-runtime-parity]
    if: always()
    outputs:
      macro_runtime_parity_weekly_marker: ${{ steps.emit.outputs.macro_runtime_parity_weekly_marker }}
      full1_macro_parity_marker: ${{ steps.emit.outputs.full1_macro_parity_marker }}
    steps:
      - name: Write macro parity summary artifact
        run: |
          set -euo pipefail
          mkdir -p .artifacts/macro-runtime-parity
          matrix_result='${{ needs.macro-runtime-parity.result }}'
          trigger='${{ github.event_name }}'
          jq -n \
            --arg workflow "Macro Runtime Parity (Weekly)" \
            --arg run_id "${{ github.run_id }}" \
            --arg run_attempt "${{ github.run_attempt }}" \
            --arg matrix_result "$matrix_result" \
            --arg trigger "$trigger" \
            '{
              schema: "macro-runtime-parity-summary.v1",
              workflow: $workflow,
              run_id: $run_id,
              run_attempt: $run_attempt,
              trigger: $trigger,
              jobs: {
                macro_runtime_parity: { result: $matrix_result }
              },
              aggregate_markers: [
                "MACRO_RUNTIME_PARITY_WEEKLY:PASS",
                "FULL1_MACRO_PARITY:PASS"
              ]
            }' > .artifacts/macro-runtime-parity/summary.json

      - name: Upload parity summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-runtime-parity-summary-${{ github.run_id }}
          path: .artifacts/macro-runtime-parity/summary.json
          if-no-files-found: error

      - name: Emit parity markers
        id: emit
        run: |
          set -euo pipefail
          matrix_result='${{ needs.macro-runtime-parity.result }}'
          echo "macro_runtime_parity=${matrix_result}"
          if [ "$matrix_result" = "success" ]; then
            echo "MACRO_RUNTIME_PARITY_WEEKLY:PASS"
            echo "FULL1_MACRO_PARITY:PASS"
            echo "macro_runtime_parity_weekly_marker=MACRO_RUNTIME_PARITY_WEEKLY:PASS" >> "$GITHUB_OUTPUT"
            echo "full1_macro_parity_marker=FULL1_MACRO_PARITY:PASS" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "MACRO_RUNTIME_PARITY_WEEKLY:FAIL" >&2
          echo "FULL1_MACRO_PARITY:FAIL" >&2
          exit 1
