name: Full1 / Source-Build Probe

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * 6"

# Diagnostic but still expensive; cancel stale reruns within the same event/ref lane.
concurrency:
  group: full1-source-probe-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "20"
  HAXE_VERSION: "4.3.7"
  # Diagnostic lane follows the same worker policy unless a probe explicitly
  # overrides it for a measured A/B.
  HXHX_DUNE_JOBS: "auto"

jobs:
  full1_source_probe:
    name: Full1 source-build probe (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install host toolchains (source probe)
        run: |
          set -euo pipefail
          retry_apt() {
            local max_attempts=4
            local attempt=1
            while true; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "APT command failed after ${attempt} attempts: $*" >&2
                return 1
              fi
              echo "APT command failed (attempt ${attempt}/${max_attempts}): $*" >&2
              attempt=$((attempt + 1))
              sleep 5
            done
          }

          retry_apt sudo apt-get update

          dune_candidate="$(apt-cache policy dune | awk '/Candidate:/ { print $2; exit }')"
          if [ -n "${dune_candidate:-}" ] && [ "${dune_candidate}" != "(none)" ]; then
            dune_pkg="dune"
          else
            dune_pkg="ocaml-dune"
          fi

          retry_apt sudo apt-get install -y \
            ocaml "${dune_pkg}" ocaml-findlib \
            neko \
            python3 pypy3 \
            default-jdk \
            build-essential \
            php \
            lua5.4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v5
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          npx lix download
          npx lix download haxe "${{ env.HAXE_VERSION }}"
          npx lix use haxe "${{ env.HAXE_VERSION }}"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version

      - name: Download Haxe libraries (lix)
        run: npx lix download

      - name: Fetch upstream Haxe checkout (vendor/haxe)
        run: bash scripts/vendor/fetch-haxe-upstream.sh

      - name: Run Full1 source-build probe (non-blocking)
        run: |
          set +e
          node scripts/ci/full1-source-probe.js --artifacts-dir ".artifacts/full1/source-probe" &
          probe_pid="$!"
          elapsed=0
          while kill -0 "${probe_pid}" 2>/dev/null; do
            echo "full1-source-probe heartbeat: pid=${probe_pid} elapsed=${elapsed}s"
            sleep 20
            elapsed=$((elapsed + 20))
          done
          wait "${probe_pid}"
          probe_exit="$?"
          set -e
          echo "full1-source-probe exit=${probe_exit} (non-blocking lane)"
          if [ -f ".artifacts/full1/source-probe/source-probe.summary.json" ]; then
            echo "full1-source-probe summary:"
            cat ".artifacts/full1/source-probe/source-probe.summary.json"
          else
            echo "full1-source-probe summary missing"
          fi
          exit 0

      - name: Upload source-probe artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full1-source-probe-${{ github.run_id }}
          path: |
            .artifacts/full1/source-probe/source-probe.summary.json
            .artifacts/full1/source-probe/*.log
            .artifacts/full1/source-probe/suites/*.log
            .artifacts/full1/source-probe/suites/*.summary.json
          if-no-files-found: warn
