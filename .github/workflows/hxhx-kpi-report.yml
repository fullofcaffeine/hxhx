name: Perf / HXHX KPI (Report Only)

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '.beads/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'docs/**'
      - '*.md'
      - '**/*.md'
  pull_request:
    branches: [ master, main ]
    paths-ignore:
      - '.beads/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'docs/**'
      - '*.md'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      compare_native:
        description: Measure bytecode and native hxhx sequentially on the same runner
        required: false
        type: boolean
        default: false

concurrency:
  group: hxhx-kpi-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "20"
  HAXE_VERSION: "4.3.7"
  HXHX_KPI_REPS: "2"
  HXHX_KPI_RUN_MACRO_LANE: "1"

jobs:
  kpi-report:
    name: HXHX KPI upstream/portable/metal (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup OCaml toolchain (OCaml 5.2.1)
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.1
          dune-cache: true

      - name: Install OCaml packages
        run: |
          set -euo pipefail
          eval "$(opam env)"
          opam install -y dune ocamlfind
          eval "$(opam env)"
          dune --version
          ocamlc -version

      - name: Export OCaml switch binaries to PATH
        run: |
          set -euo pipefail
          eval "$(opam env)"
          echo "${OPAM_SWITCH_PREFIX}/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v4
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          npx lix download
          npx lix download haxe "${{ env.HAXE_VERSION }}"
          npx lix use haxe "${{ env.HAXE_VERSION }}"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version

      - name: Download Haxe libraries (lix)
        run: npx lix download

      - name: Run HXHX KPI benchmark (report-only)
        id: bench
        run: |
          set +e
          REPORT_DIR="$RUNNER_TEMP/hxhx_kpi_report"
          echo "report_dir=$REPORT_DIR" >> "$GITHUB_OUTPUT"
          HXHX_KPI_REPORT_DIR="$REPORT_DIR" npm run hxhx:bench:kpi
          status=$?
          validation_status=0
          if [ -f "$REPORT_DIR/report.json" ]; then
            node scripts/ci/hxhx-kpi-report-validator.js --report "$REPORT_DIR/report.json"
            validation_status=$?
          else
            echo "KPI report.json was not created." >&2
            validation_status=1
          fi
          if [ "$status" -eq 0 ] && [ "$validation_status" -ne 0 ]; then
            status="$validation_status"
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "HXHX KPI benchmark failed (report-only)." >&2
          fi
          exit 0

      - name: Compare bytecode and native hxhx (manual opt-in, report-only)
        id: artifact_compare
        if: github.event_name == 'workflow_dispatch' && inputs.compare_native
        run: |
          set +e
          comparison_dir="$RUNNER_TEMP/hxhx_kpi_artifact_comparison"
          HXHX_KPI_BYTECODE_REPORT_DIR="${{ steps.bench.outputs.report_dir }}" \
            HXHX_KPI_COMPARISON_DIR="$comparison_dir" \
            bash scripts/hxhx/bench-kpi-artifact-comparison.sh
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "Bytecode/native KPI comparison did not produce comparable evidence (report-only)." >&2
          fi
          exit 0

      - name: Add benchmark summary
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          report_dir = Path(os.environ["KPI_REPORT_DIR"])
          report_path = report_dir / "report.json"
          exit_code = os.environ.get("KPI_EXIT_CODE", "")

          lines = []
          lines.append("### HXHX KPI upstream/portable/metal (report-only)")
          lines.append("")
          lines.append(f"- Exit code: `{exit_code}`")
          lines.append("- Mode: `report-only` (non-blocking)")
          lines.append("")

          if not report_path.exists():
            lines.append("No KPI report generated.")
            summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
            raise SystemExit(0)

          payload = json.loads(report_path.read_text(encoding="utf-8"))
          config = payload.get("config", {})
          git = payload.get("git", {})
          environment = payload.get("environment", {})
          measurement = payload.get("measurement", {})
          lines.append(f"- Schema: `{payload.get('schema')}`")
          lines.append(f"- Commit: `{git.get('commit')}` | Tracked source clean: `{git.get('tracked_source_clean')}`")
          lines.append(
            f"- Runner: `{environment.get('os')} {environment.get('architecture')}` | "
            f"CPU: `{environment.get('cpu_model')}`"
          )
          lines.append(
            f"- Toolchains: Haxe `{environment.get('haxe_version')}`, "
            f"Node `{environment.get('node_version')}`, OCaml `{environment.get('ocaml_version')}`, "
            f"Dune `{environment.get('dune_version')}`"
          )
          lines.append(f"- hxhx artifact kind: `{environment.get('hxhx_artifact_kind')}`")
          lines.append(f"- Command: `{measurement.get('command')}`")
          lines.append(f"- Reps: `{config.get('reps')}` | Macro lane: `{config.get('run_macro_lane')}`")
          lines.append("")

          ratios = payload.get("lane_ratios", [])
          if ratios:
            lines.append("| Ratio | Metric | Value |")
            lines.append("|---|---|---:|")
            for ratio in ratios:
              ratio_name = ratio.get("name", "?")
              metrics = ratio.get("metrics", {})
              for metric, value in sorted(metrics.items()):
                if value is None:
                  continue
                lines.append(f"| `{ratio_name}` | `{metric}` | `{value}` |")
          else:
            lines.append("No lane ratio rows were emitted.")

          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
        env:
          KPI_REPORT_DIR: ${{ steps.bench.outputs.report_dir }}
          KPI_EXIT_CODE: ${{ steps.bench.outputs.exit_code }}

      - name: Add bytecode/native comparison summary
        if: always() && github.event_name == 'workflow_dispatch' && inputs.compare_native
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          comparison_path = Path(os.environ["KPI_COMPARISON_DIR"]) / "comparison.json"
          exit_code = os.environ.get("KPI_COMPARISON_EXIT_CODE", "")
          lines = [
            "",
            "### Same-run hxhx bytecode/native comparison",
            "",
            f"- Exit code: `{exit_code}`",
            "- Mode: `diagnostic-only` (no release threshold)",
          ]
          if not comparison_path.exists():
            lines.extend(["", "No comparable bytecode/native artifact was produced."])
          else:
            payload = json.loads(comparison_path.read_text(encoding="utf-8"))
            lines.extend([
              f"- Commit: `{payload['git']['commit']}`",
              f"- CPU: `{payload['environment']['cpu_model']}`",
              "",
              "| Metric | Lane | Bytecode median | Native median | Native / bytecode |",
              "|---|---|---:|---:|---:|",
            ])
            for row in payload.get("metrics", []):
              if row.get("metric") not in {"compile_wall_ms", "incremental_rebuild_ms"}:
                continue
              if row.get("lane") == "upstream_haxe":
                continue
              ratio = row.get("nativeOverBytecode")
              ratio_text = "n/a" if ratio is None else str(ratio)
              lines.append(
                f"| `{row['metric']}` | `{row['lane']}` | "
                f"{row['bytecodeMedian']} {row['unit']} | {row['nativeMedian']} {row['unit']} | {ratio_text} |"
              )
          with summary_path.open("a", encoding="utf-8") as handle:
            handle.write("\n".join(lines) + "\n")
          PY
        env:
          KPI_COMPARISON_DIR: ${{ runner.temp }}/hxhx_kpi_artifact_comparison
          KPI_COMPARISON_EXIT_CODE: ${{ steps.artifact_compare.outputs.exit_code }}

      - name: Upload KPI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hxhx-kpi-report-${{ github.run_id }}
          path: ${{ steps.bench.outputs.report_dir }}
          if-no-files-found: warn
          retention-days: 14

      - name: Upload bytecode/native comparison artifacts
        if: always() && github.event_name == 'workflow_dispatch' && inputs.compare_native
        uses: actions/upload-artifact@v4
        with:
          name: hxhx-kpi-bytecode-native-${{ github.run_id }}
          path: ${{ runner.temp }}/hxhx_kpi_artifact_comparison
          if-no-files-found: warn
          retention-days: 14
