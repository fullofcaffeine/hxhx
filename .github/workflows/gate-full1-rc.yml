name: Gate Full1 RC / Release Go-No-Go

on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: gate-full1-rc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  FULL1_RC_RELEASE_MARKER: "FULL1_RELEASE_GO:PASS"

jobs:
  full1_gate:
    name: Full1 strict matrix, macro/eval, and plugin gate
    uses: ./.github/workflows/gate-full1.yml
    secrets: inherit

  full1_perf:
    name: Full1 performance parity gate
    uses: ./.github/workflows/gate-perf-full1.yml
    secrets: inherit

  full1_rc:
    name: Full1 RC aggregate marker
    runs-on: ubuntu-latest
    needs:
      - full1_gate
      - full1_perf
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluate Full1 RC evidence
        run: |
          set -euo pipefail
          mkdir -p .artifacts/full1/rc
          markers=()

          add_marker() {
            markers+=("--marker" "$1")
          }

          run_guard() {
            local marker="$1"
            shift
            local log=".artifacts/full1/rc/${marker%%:*}.log"
            set +e
            "$@" >"$log" 2>&1
            local status="$?"
            set -e
            cat "$log"
            if [ "$status" -eq 0 ]; then
              add_marker "$marker"
            else
              echo "Full1 RC guard failed for ${marker}: $*" >&2
            fi
          }

          full1_gate_result='${{ needs.full1_gate.result }}'
          full1_perf_result='${{ needs.full1_perf.result }}'
          echo "full1_gate=${full1_gate_result}"
          echo "full1_perf=${full1_perf_result}"

          if [ "$full1_gate_result" = "success" ]; then
            add_marker "FULL1_GATE3_EXTENDED_TARGETS:PASS"
            add_marker "FULL1_SUITE_MISC:PASS"
            add_marker "FULL1_SUITE_SERVER:PASS"
            add_marker "FULL1_SUITE_THREADS:PASS"
            add_marker "FULL1_SUITE_OPTIMIZATION:PASS"
            add_marker "FULL1_SUITE_DISPLAY:PASS"
            add_marker "FULL1_SUITE_MATRIX:PASS"
            add_marker "FULL1_MACRO_EVAL_PARITY:PASS"
            add_marker "FULL1_PLUGIN_PARITY:PASS"
          else
            echo "Full1 aggregate gate did not pass; release marker will not be emitted." >&2
          fi

          if [ "$full1_perf_result" = "success" ]; then
            add_marker "FULL1_PERF_PARITY:PASS"
          else
            echo "Full1 perf gate did not pass; release marker will not be emitted." >&2
          fi

          run_guard "FULL1_PARITY_MAP:PASS" node scripts/ci/full1-parity-map-check.js
          run_guard "FULL1_MACRO_EVAL_CONTRACT:PASS" node scripts/ci/full1-macro-eval-contract-check.js
          run_guard "FULL1_PLUGIN_PARITY_CONTRACT:PASS" node scripts/ci/full1-plugin-parity-contract-check.js
          run_guard "FULL1_FLAKE_POLICY:PASS" node scripts/ci/full1-flake-policy-check.js
          run_guard "FULL1_PERF_POLICY:PASS" node scripts/ci/full1-perf-policy-check.js

          node scripts/ci/full1-rc-gate.js \
            --json-out .artifacts/full1/rc/full1-rc.summary.json \
            "${markers[@]}"

      - name: Upload Full1 RC summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full1-rc-summary-${{ github.run_id }}
          path: .artifacts/full1/rc
          if-no-files-found: warn
          retention-days: 30
