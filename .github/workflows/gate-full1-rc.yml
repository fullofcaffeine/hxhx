name: Gate Full1 RC / Release Go-No-Go

on:
  workflow_dispatch:
    inputs:
      candidate_version:
        description: "Exact semantic version this evidence would authorize"
        required: true
        type: string
      provenance_only:
        description: "Exercise the artifact handoff and expect a no-go decision"
        required: false
        type: boolean
        default: false

concurrency:
  group: gate-full1-rc-${{ github.ref }}-${{ inputs.candidate_version }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "20"
  FULL1_RC_MAX_AGE_HOURS: "24"

jobs:
  policy_evidence:
    name: Candidate-bound policy evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Run policy guards and write evidence
        run: |
          set -euo pipefail
          node scripts/ci/full1-rc-policy-evidence.js \
            --candidate-sha "${{ github.sha }}" \
            --candidate-version "${{ inputs.candidate_version }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --json-out .artifacts/full1/rc-policy/full1-rc-policy.summary.json

      - name: Upload policy evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full1-rc-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/full1/rc-policy/full1-rc-policy.summary.json
          if-no-files-found: error
          retention-days: 30

  full1_gate:
    name: Full1 strict matrix, macro/eval, and plugin gate
    if: ${{ !inputs.provenance_only }}
    uses: ./.github/workflows/gate-full1.yml
    secrets: inherit

  full1_perf:
    name: Full1 performance parity gate
    if: ${{ !inputs.provenance_only }}
    uses: ./.github/workflows/gate-perf-full1.yml
    secrets: inherit

  full1_rc:
    name: Verify child artifacts and decide go/no-go
    runs-on: ubuntu-latest
    needs:
      - policy_evidence
      - full1_gate
      - full1_perf
    if: always()
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Download and validate exact child artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROVENANCE_ONLY: ${{ inputs.provenance_only }}
        run: |
          set -euo pipefail
          extra_args=()
          if [ "$PROVENANCE_ONLY" = "true" ]; then
            extra_args+=(--provenance-only)
          fi
          node scripts/ci/full1-rc-artifact-collector.js \
            --repository "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --candidate-sha "${{ github.sha }}" \
            --candidate-version "${{ inputs.candidate_version }}" \
            --out-dir "${RUNNER_TEMP}/full1-rc-child-artifacts" \
            --index-out .artifacts/full1/rc/full1-rc.evidence-index.json \
            "${extra_args[@]}"

      - name: Evaluate verified Full1 evidence
        id: evaluate
        continue-on-error: true
        run: |
          set -euo pipefail
          node scripts/ci/full1-rc-gate.js \
            --evidence-index .artifacts/full1/rc/full1-rc.evidence-index.json \
            --candidate-sha "${{ github.sha }}" \
            --candidate-version "${{ inputs.candidate_version }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --max-age-hours "$FULL1_RC_MAX_AGE_HOURS" \
            --json-out .artifacts/full1/rc/full1-rc.summary.json

      - name: Upload candidate-bound RC decision
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full1-rc-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/full1/rc/full1-rc.evidence-index.json
            .artifacts/full1/rc/full1-rc.summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce the RC decision
        if: steps.evaluate.outcome != 'success'
        run: |
          echo "FULL1_RELEASE_GO:FAIL"
          echo "The RC artifact was preserved, but this candidate is not authorized for publication." >&2
          exit 1
