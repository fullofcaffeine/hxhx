name: Gate 3 Full1 / Extended Targets Strict

on:
  workflow_call:
    inputs:
      targets:
        description: "Comma-separated upstream runci targets"
        required: false
        type: string
        default: "Macro,Js,Neko,Hl,Python,Java,Cs,Cpp,Lua,Php"
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma-separated upstream runci targets"
        type: string
        required: false
        default: "Macro,Js,Neko,Hl,Python,Java,Cs,Cpp,Lua,Php"
  schedule:
    # Weekly strict extended target matrix evidence for Full1.
    - cron: "0 13 * * 4"

concurrency:
  group: gate3-full1-extended-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "20"
  HAXE_VERSION: "4.3.7"
  # Benchmark-backed policy: keep dune worker selection automatic unless a
  # workflow-specific memory envelope has fresh evidence for a fixed cap.
  HXHX_DUNE_JOBS: "auto"
  FULL1_GATE3_EXTENDED_ARTIFACTS_DIR: ".artifacts/full1"
  FULL1_GATE3_EXTENDED_TIMINGS_JSONL: ".artifacts/full1/gate3-full1-extended.timings.jsonl"
  # Keep the inner matrix timeout below the job timeout so timeout failures
  # are recorded as failed phases/artifacts instead of GitHub job cancellation.
  FULL1_GATE3_EXTENDED_MATRIX_TIMEOUT_SEC: "13200"

jobs:
  full1_gate3_extended:
    name: Full1 Gate3 extended targets (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host toolchains (extended Gate3 set)
        env:
          REQUESTED_TARGETS: ${{ inputs.targets || 'Macro,Js,Neko,Hl,Python,Java,Cs,Cpp,Lua,Php' }}
        run: |
          set -euo pipefail
          mkdir -p "$FULL1_GATE3_EXTENDED_ARTIFACTS_DIR"
          phase_start_ms="$(date +%s%3N)"
          record_phase_exit() {
            phase_exit="$?"
            trap - EXIT
            phase_end_ms="$(date +%s%3N)"
            phase_status="pass"
            if [ "$phase_exit" -ne 0 ]; then
              phase_status="fail"
            fi
            node scripts/ci/full1-phase-timing.js append \
              --jsonl "$FULL1_GATE3_EXTENDED_TIMINGS_JSONL" \
              --workflow "gate3-full1-extended" \
              --job "full1_gate3_extended" \
              --phase "install_host_toolchains" \
              --started-ms "$phase_start_ms" \
              --ended-ms "$phase_end_ms" \
              --status "$phase_status" \
              --exit-code "$phase_exit"
            exit "$phase_exit"
          }
          trap record_phase_exit EXIT
          retry_apt() {
            local max_attempts=4
            local attempt=1
            while true; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "APT command failed after ${attempt} attempts: $*" >&2
                return 1
              fi
              echo "APT command failed (attempt ${attempt}/${max_attempts}): $*" >&2
              attempt=$((attempt + 1))
              sleep 5
            done
          }

          retry_apt sudo apt-get update

          normalize_targets() {
            printf '%s\n' "${REQUESTED_TARGETS}" | tr ',' '\n' | tr '[:upper:]' '[:lower:]' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | sed '/^$/d'
          }

          target_requested() {
            local needle="$1"
            while IFS= read -r target; do
              if [ "${target}" = "${needle}" ]; then
                return 0
              fi
            done < <(normalize_targets)
            return 1
          }

          need_java=0
          need_pypy=0
          need_php=0
          need_lua=0
          need_cs=0
          need_hl=0

          if target_requested "macro" || target_requested "java" || target_requested "jvm"; then
            need_java=1
          fi
          if target_requested "python"; then
            need_pypy=1
          fi
          if target_requested "php"; then
            need_php=1
          fi
          if target_requested "lua"; then
            need_lua=1
          fi
          if target_requested "cs"; then
            need_cs=1
          fi
          if target_requested "hl"; then
            need_hl=1
          fi

          echo "Requested Gate3 targets:"
          normalize_targets | sed 's/^/  - /'

          dune_candidate="$(apt-cache policy dune | awk '/Candidate:/ { print $2; exit }')"
          if [ -n "${dune_candidate:-}" ] && [ "${dune_candidate}" != "(none)" ]; then
            dune_pkg="dune"
          else
            dune_pkg="ocaml-dune"
          fi

          retry_apt sudo apt-get install -y \
            ocaml "${dune_pkg}" ocaml-findlib \
            neko \
            python3 \
            build-essential \
            git

          if [ "${need_pypy}" = "1" ]; then
            retry_apt sudo apt-get install -y pypy3
          fi

          if [ "${need_java}" = "1" ]; then
            retry_apt sudo apt-get install -y default-jdk
          fi

          if [ "${need_php}" = "1" ]; then
            retry_apt sudo apt-get install -y php
          fi

          if [ "${need_lua}" = "1" ]; then
            retry_apt sudo apt-get install -y lua5.4 luarocks
          fi

          if [ "${need_cs}" = "1" ]; then
            retry_apt sudo apt-get install -y mono-devel
          fi

          if [ "${need_cs}" = "1" ] && ! command -v dotnet >/dev/null 2>&1; then
            retry_apt sudo apt-get install -y dotnet-sdk-8.0 || true
          fi

          if [ "${need_hl}" = "1" ] && ! command -v hl >/dev/null 2>&1; then
            retry_apt sudo apt-get install -y hashlink || true
          fi

          if [ "${need_hl}" = "1" ] && ! command -v hl >/dev/null 2>&1; then
            echo "hashlink apt package unavailable; building pinned HashLink from source..."
            retry_apt sudo apt-get install -y \
              libmbedtls-dev \
              libpcre3-dev \
              zlib1g-dev \
              libsqlite3-dev \
              libuv1-dev \
              libsdl2-dev \
              libjpeg-dev \
              libpng-dev \
              libvorbis-dev \
              libopenal-dev \
              libglu1-mesa-dev \
              libturbojpeg0-dev
            HL_REF="${HXHX_HASHLINK_REF:-1.15}"
            HL_SRC_DIR="$(mktemp -d)"
            git clone --depth 1 --branch "${HL_REF}" https://github.com/HaxeFoundation/hashlink.git "${HL_SRC_DIR}"
            make -C "${HL_SRC_DIR}" -j"$(nproc)"
            sudo cp "${HL_SRC_DIR}/hl" /usr/local/bin/hl
          fi

          echo "Toolchain versions:"
          dune --version
          ocamlc -version
          neko -version || true
          node --version || true
          if [ "${need_java}" = "1" ]; then
            javac -version
          fi
          python3 --version
          if [ "${need_pypy}" = "1" ]; then
            pypy3 --version
          fi
          if [ "${need_php}" = "1" ]; then
            php --version | head -n 1
          fi
          if [ "${need_lua}" = "1" ]; then
            lua5.4 -v || true
            luarocks --version | head -n 1
          fi
          if [ "${need_cs}" = "1" ]; then
            dotnet --version || true
            mono --version | head -n 1 || true
          fi
          if [ "${need_hl}" = "1" ]; then
            hl --version || true
          fi

          if [ "${need_cs}" = "1" ] && ! command -v dotnet >/dev/null 2>&1 && ! command -v mono >/dev/null 2>&1; then
            echo "Missing dotnet and mono for C# target." >&2
            exit 1
          fi

          if [ "${need_hl}" = "1" ] && ! command -v hl >/dev/null 2>&1; then
            echo "Missing HashLink runtime (hl) required for Hl target." >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v4
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-

      - name: Install npm dependencies
        run: |
          set -euo pipefail
          mkdir -p "$FULL1_GATE3_EXTENDED_ARTIFACTS_DIR"
          phase_start_ms="$(date +%s%3N)"
          record_phase_exit() {
            phase_exit="$?"
            trap - EXIT
            phase_end_ms="$(date +%s%3N)"
            phase_status="pass"
            if [ "$phase_exit" -ne 0 ]; then
              phase_status="fail"
            fi
            node scripts/ci/full1-phase-timing.js append \
              --jsonl "$FULL1_GATE3_EXTENDED_TIMINGS_JSONL" \
              --workflow "gate3-full1-extended" \
              --job "full1_gate3_extended" \
              --phase "install_npm_dependencies" \
              --started-ms "$phase_start_ms" \
              --ended-ms "$phase_end_ms" \
              --status "$phase_status" \
              --exit-code "$phase_exit"
            exit "$phase_exit"
          }
          trap record_phase_exit EXIT
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          mkdir -p "$FULL1_GATE3_EXTENDED_ARTIFACTS_DIR"
          phase_start_ms="$(date +%s%3N)"
          record_phase_exit() {
            phase_exit="$?"
            trap - EXIT
            phase_end_ms="$(date +%s%3N)"
            phase_status="pass"
            if [ "$phase_exit" -ne 0 ]; then
              phase_status="fail"
            fi
            node scripts/ci/full1-phase-timing.js append \
              --jsonl "$FULL1_GATE3_EXTENDED_TIMINGS_JSONL" \
              --workflow "gate3-full1-extended" \
              --job "full1_gate3_extended" \
              --phase "install_haxe" \
              --started-ms "$phase_start_ms" \
              --ended-ms "$phase_end_ms" \
              --status "$phase_status" \
              --exit-code "$phase_exit"
            exit "$phase_exit"
          }
          trap record_phase_exit EXIT
          npx lix download
          npx lix download haxe "${{ env.HAXE_VERSION }}"
          npx lix use haxe "${{ env.HAXE_VERSION }}"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version

      - name: Download Haxe libraries (lix)
        run: |
          set -euo pipefail
          mkdir -p "$FULL1_GATE3_EXTENDED_ARTIFACTS_DIR"
          phase_start_ms="$(date +%s%3N)"
          record_phase_exit() {
            phase_exit="$?"
            trap - EXIT
            phase_end_ms="$(date +%s%3N)"
            phase_status="pass"
            if [ "$phase_exit" -ne 0 ]; then
              phase_status="fail"
            fi
            node scripts/ci/full1-phase-timing.js append \
              --jsonl "$FULL1_GATE3_EXTENDED_TIMINGS_JSONL" \
              --workflow "gate3-full1-extended" \
              --job "full1_gate3_extended" \
              --phase "download_haxe_libraries" \
              --started-ms "$phase_start_ms" \
              --ended-ms "$phase_end_ms" \
              --status "$phase_status" \
              --exit-code "$phase_exit"
            exit "$phase_exit"
          }
          trap record_phase_exit EXIT
          npx lix download

      - name: Fetch upstream Haxe checkout (vendor/haxe)
        run: |
          set -euo pipefail
          mkdir -p "$FULL1_GATE3_EXTENDED_ARTIFACTS_DIR"
          phase_start_ms="$(date +%s%3N)"
          record_phase_exit() {
            phase_exit="$?"
            trap - EXIT
            phase_end_ms="$(date +%s%3N)"
            phase_status="pass"
            if [ "$phase_exit" -ne 0 ]; then
              phase_status="fail"
            fi
            node scripts/ci/full1-phase-timing.js append \
              --jsonl "$FULL1_GATE3_EXTENDED_TIMINGS_JSONL" \
              --workflow "gate3-full1-extended" \
              --job "full1_gate3_extended" \
              --phase "fetch_upstream_haxe" \
              --started-ms "$phase_start_ms" \
              --ended-ms "$phase_end_ms" \
              --status "$phase_status" \
              --exit-code "$phase_exit"
            exit "$phase_exit"
          }
          trap record_phase_exit EXIT
          bash scripts/vendor/fetch-haxe-upstream.sh

      - name: Run strict extended Gate3 matrix
        env:
          HXHX_GATE3_TARGETS: ${{ inputs.targets || 'Macro,Js,Neko,Hl,Python,Java,Cs,Cpp,Lua,Php' }}
          HXHX_GATE3_ALLOW_SKIP: "0"
          HXHX_GATE3_MACRO_MODE: "direct"
          HXHX_FORBID_STAGE0: "1"
          HXHX_GATE3_RETRY_COUNT: "1"
          HXHX_GATE3_RETRY_TARGETS: "Js"
          HXHX_GATE3_RETRY_DELAY_SEC: "3"
          HXHX_GATE3_JS_SERVER_TIMEOUT_MS: "60000"
          HXHX_GATE3_PYTHON_ALLOW_INSTALL: "0"
          HXHX_GATE3_TARGET_HEARTBEAT_SEC: "20"
          HXHX_GATE3_TARGET_TIMEOUT_SEC: "4200"
          HXHX_GATE3_TRACE_STAGE3_TARGETS: "Cpp"
        run: |
          set -euo pipefail
          mkdir -p "$FULL1_GATE3_EXTENDED_ARTIFACTS_DIR"
          phase_start_ms="$(date +%s%3N)"
          record_phase_exit() {
            phase_exit="$?"
            trap - EXIT
            phase_end_ms="$(date +%s%3N)"
            phase_status="pass"
            if [ "$phase_exit" -ne 0 ]; then
              phase_status="fail"
            fi
            node scripts/ci/full1-phase-timing.js append \
              --jsonl "$FULL1_GATE3_EXTENDED_TIMINGS_JSONL" \
              --workflow "gate3-full1-extended" \
              --job "full1_gate3_extended" \
              --phase "strict_extended_gate3_matrix" \
              --started-ms "$phase_start_ms" \
              --ended-ms "$phase_end_ms" \
              --status "$phase_status" \
              --exit-code "$phase_exit"
            exit "$phase_exit"
          }
          trap record_phase_exit EXIT
          log_path="$FULL1_GATE3_EXTENDED_ARTIFACTS_DIR/gate3-full1-extended.log"
          summary_path="$FULL1_GATE3_EXTENDED_ARTIFACTS_DIR/gate3-full1-extended.summary.json"
          echo "HXHX_GATE3_TARGETS=${HXHX_GATE3_TARGETS}"
          echo "HXHX_GATE3_ALLOW_SKIP=${HXHX_GATE3_ALLOW_SKIP}"
          echo "HXHX_GATE3_MACRO_MODE=${HXHX_GATE3_MACRO_MODE}"
          echo "HXHX_FORBID_STAGE0=${HXHX_FORBID_STAGE0}"
          echo "FULL1_GATE3_EXTENDED_MATRIX_TIMEOUT_SEC=${FULL1_GATE3_EXTENDED_MATRIX_TIMEOUT_SEC}"
          set +e
          timeout --foreground "${FULL1_GATE3_EXTENDED_MATRIX_TIMEOUT_SEC}s" \
            npm run test:upstream:runci-targets 2>&1 | tee "$log_path"
          run_status="${PIPESTATUS[0]}"
          set -e

          set +e
          node scripts/ci/gate3-target-summary.js \
            --log "$log_path" \
            --targets "${HXHX_GATE3_TARGETS}" \
            --json-out "$summary_path" \
            --require-no-skip \
            --require-all-targets \
            --marker "FULL1_GATE3_EXTENDED_TARGETS:PASS"
          summary_status="$?"
          set -e

          if [ "$run_status" -ne 0 ]; then
            echo "Strict extended Gate3 command failed with exit code ${run_status}." >&2
            if [ "$run_status" -eq 124 ]; then
              echo "Strict extended Gate3 command hit the inner matrix timeout before aggregate validation." >&2
            fi
          fi
          if [ "$summary_status" -ne 0 ]; then
            echo "Strict extended Gate3 summary validation failed with exit code ${summary_status}." >&2
          fi
          if [ "$run_status" -ne 0 ] || [ "$summary_status" -ne 0 ]; then
            exit 1
          fi

      - name: Summarize Full1 Gate3 extended timings
        if: always()
        run: |
          set -euo pipefail
          timings="$FULL1_GATE3_EXTENDED_TIMINGS_JSONL"
          if [ -f "$timings" ]; then
            node scripts/ci/full1-phase-timing.js summarize \
              --jsonl "$timings" \
              --json-out "$FULL1_GATE3_EXTENDED_ARTIFACTS_DIR/gate3-full1-extended.timings.summary.json" \
              --markdown-out "$FULL1_GATE3_EXTENDED_ARTIFACTS_DIR/gate3-full1-extended.timings.md"
            cat "$FULL1_GATE3_EXTENDED_ARTIFACTS_DIR/gate3-full1-extended.timings.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Full1 Gate3 extended artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full1-gate3-extended-${{ github.run_id }}
          path: |
            .artifacts/full1/gate3-full1-extended.log
            .artifacts/full1/gate3-full1-extended.summary.json
            .artifacts/full1/gate3-full1-extended.timings.jsonl
            .artifacts/full1/gate3-full1-extended.timings.summary.json
            .artifacts/full1/gate3-full1-extended.timings.md
            .artifacts/full1/gate3-target-artifacts/**
          if-no-files-found: warn
