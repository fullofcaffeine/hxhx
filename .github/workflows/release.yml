name: Release / Semantic Publish

on:
  workflow_run:
    workflows: ["CI / Core PR Checks"]
    types: [completed]
    branches: [master, main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "20"
  FULL1_RELEASE_GO_MARKER: ""
  FULL1_RC_SUMMARY_JSON: ""

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       !contains(github.event.workflow_run.head_commit.message, 'chore(release):'))
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Configure git identity (for release commits)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release policy marker (M7 strict)
        run: |
          set -euo pipefail
          echo "M7_RELEASE_POLICY=SEPARATE_GATE"
          echo "M7 strict is not a blocking precondition for automated 0.x semantic publish."
          echo "Scoped 1.0 release sign-off requires Gate M7 strict markers (M7_STRICT_STAGE0:PASS and M7_REPLACEMENT_READY:PASS)."
          echo "Full 1.0 / >=1.0.0 release paths are blocked by semantic-release verifyReleaseCmd unless FULL1_RELEASE_GO:PASS and a valid Full1 RC summary JSON are supplied."

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: npx semantic-release
