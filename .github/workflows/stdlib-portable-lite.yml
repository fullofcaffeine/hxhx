name: Stdlib Portable / Tier1

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '.beads/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'docs/**'
      - '*.md'
      - '**/*.md'
  pull_request:
    branches: [ master, main ]
    paths-ignore:
      - '.beads/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'docs/**'
      - '*.md'
      - '**/*.md'

concurrency:
  group: stdlib-portable-lite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "20"
  HAXE_VERSION: "4.3.7"

jobs:
  stdlib_portable_tier1:
    name: Stdlib portable tier1 (shard ${{ matrix.shard_index }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Restore the .deb files that the Core test-shards job saves on main, so setup-ocaml does
      # not download them again from a slow mirror (haxe_ocaml-vxnea). Restore only.
      - name: Select apt package cache
        id: apt-cache-key
        run: |
          set -euo pipefail
          prefix="${RUNNER_OS}-apt-base-v1-${ImageOS:-unknown}-"
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}${ImageVersion:-unknown}-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore downloaded apt packages
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/hxhx-apt-archives
          key: ${{ steps.apt-cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.apt-cache-key.outputs.prefix }}
      - name: Seed apt with cached packages
        run: |
          set -euo pipefail
          cache_dir="$HOME/.cache/hxhx-apt-archives"
          mkdir -p "$cache_dir"
          count="$(find "$cache_dir" -maxdepth 1 -name '*.deb' | wc -l)"
          if [ "$count" -gt 0 ]; then
            sudo cp "$cache_dir"/*.deb /var/cache/apt/archives/
          fi
          echo "Seeded ${count} cached apt packages"
      - name: Setup OCaml toolchain (OCaml 5.2.1)
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.1
          dune-cache: true

      - name: Install OCaml packages
        run: |
          set -euo pipefail
          eval "$(opam env)"
          opam install -y dune ocamlfind
          eval "$(opam env)"
          dune --version
          ocamlc -version

      - name: Export OCaml switch binaries to PATH
        run: |
          set -euo pipefail
          eval "$(opam env)"
          echo "${OPAM_SWITCH_PREFIX}/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v5
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          npx lix download
          npx lix download haxe "${{ env.HAXE_VERSION }}"
          npx lix use haxe "${{ env.HAXE_VERSION }}"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version

      - name: Download Haxe libraries (lix)
        run: npx lix download

      - name: Fetch upstream Haxe checkout (vendor/haxe)
        run: bash scripts/vendor/fetch-haxe-upstream.sh

      - name: Run stdlib portable tier1 suite
        env:
          PORTABLE_FIXTURE_TIMEOUT_SECONDS: "2100"
          PORTABLE_JOBS: "4"
          PORTABLE_SHARD_COUNT: "3"
          PORTABLE_SHARD_INDEX: "${{ matrix.shard_index }}"
        run: npm run test:stdlib:portable:tier1
