name: Utility / Bootstrap Regen Benchmark

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Comma-separated scenarios (cold,skip,select; warm is blocked until Reflaxe target reuse is complete)"
        required: true
        default: "skip,select"
      reps:
        description: "Repetitions per scenario"
        required: true
        default: "1"
      verify:
        description: "Run snapshot verify step (0/1)"
        required: true
        default: "0"
      dune_jobs:
        description: "Comma-separated dune worker settings (auto,2,4...)"
        required: true
        default: "auto,2,4"
      compare_stage0_policies:
        description: "Compare wrapper/native stage0 policy pairs (0/1)"
        required: true
        default: "1"
      stage0_policy:
        description: "Stage0 policy override when compare_stage0_policies=0"
        required: false
        default: ""
      upload_snapshot:
        description: "Upload the generated bootstrap snapshot for review (0/1)"
        required: true
        default: "0"
      stage0_failfast_secs:
        description: "Absolute Stage0 emit timeout in seconds"
        required: true
        default: "3600"

permissions:
  contents: read

concurrency:
  group: bootstrap-regen-bench-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "20"
  HAXE_VERSION: "4.3.7"

jobs:
  bench:
    name: Benchmark bootstrap regen harness
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup OCaml toolchain (OCaml 5.2.1)
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.1
          dune-cache: true

      - name: Install OCaml packages
        run: |
          set -euo pipefail
          eval "$(opam env)"
          opam install -y dune ocamlfind
          eval "$(opam env)"
          dune --version
          ocamlc -version

      - name: Export OCaml switch binaries to PATH
        run: |
          set -euo pipefail
          eval "$(opam env)"
          echo "${OPAM_SWITCH_PREFIX}/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v4
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          npx lix download
          npx lix download haxe "${{ env.HAXE_VERSION }}"
          npx lix use haxe "${{ env.HAXE_VERSION }}"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version

      - name: Download Haxe libraries (lix)
        run: npx lix download

      - name: Run bootstrap regen benchmark
        id: bench
        run: |
          set -euo pipefail
          REPORT_DIR="$RUNNER_TEMP/bootstrap_regen_bench"
          echo "report_dir=$REPORT_DIR" >> "$GITHUB_OUTPUT"
          HXHX_BOOTSTRAP_BENCH_SCENARIOS="${{ github.event.inputs.scenarios }}" \
          HXHX_BOOTSTRAP_BENCH_REPS="${{ github.event.inputs.reps }}" \
          HXHX_BOOTSTRAP_BENCH_VERIFY="${{ github.event.inputs.verify }}" \
          HXHX_BOOTSTRAP_BENCH_DUNE_JOBS="${{ github.event.inputs.dune_jobs }}" \
          HXHX_BOOTSTRAP_BENCH_COMPARE_STAGE0_POLICIES="${{ github.event.inputs.compare_stage0_policies }}" \
          HXHX_BOOTSTRAP_BENCH_STAGE0_HAXE_POLICY="${{ github.event.inputs.stage0_policy }}" \
          HXHX_STAGE0_FAILFAST_SECS="${{ github.event.inputs.stage0_failfast_secs }}" \
          HXHX_BOOTSTRAP_BENCH_REPORT_DIR="$REPORT_DIR" \
          npm run hxhx:bench:bootstrap-regen

      - name: Add benchmark summary
        if: always()
        run: |
          set -euo pipefail
          REPORT_DIR="${{ steps.bench.outputs.report_dir }}"
          REPORT="$REPORT_DIR/report.json"
          RESULTS="$REPORT_DIR/results.tsv"
          if [ -f "$REPORT" ]; then
            node scripts/ci/bootstrap-regen-benchmark-report.js markdown --report "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          elif [ -f "$RESULTS" ]; then
            {
              echo "### Bootstrap regen benchmark"
              echo ""
              echo "- Scenarios: \`${{ github.event.inputs.scenarios }}\`"
              echo "- Repetitions: \`${{ github.event.inputs.reps }}\`"
              echo "- Verify: \`${{ github.event.inputs.verify }}\`"
              echo "- Dune jobs: \`${{ github.event.inputs.dune_jobs }}\`"
              echo "- Compare stage0 policies: \`${{ github.event.inputs.compare_stage0_policies }}\`"
              echo "- Stage0 policy override: \`${{ github.event.inputs.stage0_policy || 'default' }}\`"
              echo ""
              echo "\`\`\`"
              cat "$RESULTS"
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-regen-bench-${{ github.run_id }}
          path: ${{ steps.bench.outputs.report_dir }}
          if-no-files-found: warn
          retention-days: 14

      - name: Upload generated bootstrap snapshot
        if: ${{ always() && github.event.inputs.upload_snapshot == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-regen-snapshot-${{ github.run_id }}
          path: packages/hxhx/bootstrap_out
          if-no-files-found: error
          retention-days: 14
