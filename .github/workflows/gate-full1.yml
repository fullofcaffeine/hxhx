name: Gate Full1 / Strict Matrix + Macro Eval + Plugin Parity

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    # Weekly Full1 strict matrix aggregation.
    - cron: "0 11 * * 6"
  release:
    types: [published]

concurrency:
  group: gate-full1-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  full1_gate3_extended:
    name: Full1 Gate3 extended targets
    uses: ./.github/workflows/gate3-full1-extended.yml
    secrets: inherit

  full1_suite_runners:
    name: Full1 strict suite runners
    uses: ./.github/workflows/full1-suite-runners.yml
    secrets: inherit

  full1_macro_eval:
    name: Full1 artifact-verified macro/eval evidence
    uses: ./.github/workflows/full1-macro-eval.yml
    secrets: inherit

  full1_plugin_parity:
    name: Full1 plugin parity
    uses: ./.github/workflows/full1-plugin-parity.yml
    secrets: inherit

  full1_aggregate:
    name: Full1 aggregate marker
    runs-on: ubuntu-latest
    needs:
      - full1_gate3_extended
      - full1_suite_runners
      - full1_macro_eval
      - full1_plugin_parity
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact-verified macro/eval summary
        id: download_macro_eval
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: full1-macro-eval-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/full1/macro-eval

      - name: Validate macro/eval summary at the Full1 boundary
        id: validate_macro_eval
        continue-on-error: true
        run: |
          set -euo pipefail
          node scripts/ci/full1-macro-eval-evidence.js verify \
            --summary .artifacts/full1/macro-eval/full1-macro-eval.summary.json \
            --candidate-sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}"

      - name: Write Full1 summary artifact
        run: |
          set -euo pipefail
          mkdir -p .artifacts/full1
          gate3_result='${{ needs.full1_gate3_extended.result }}'
          suites_result='${{ needs.full1_suite_runners.result }}'
          macro_eval_workflow_result='${{ needs.full1_macro_eval.result }}'
          macro_eval_evidence_result='${{ steps.validate_macro_eval.outcome }}'
          plugin_result='${{ needs.full1_plugin_parity.result }}'
          jq -n \
            --arg gate3_result "$gate3_result" \
            --arg suites_result "$suites_result" \
            --arg macro_eval_workflow_result "$macro_eval_workflow_result" \
            --arg macro_eval_evidence_result "$macro_eval_evidence_result" \
            --arg plugin_result "$plugin_result" \
            --arg workflow "Gate Full1 / Strict Matrix + Macro Eval + Plugin Parity" \
            --arg run_id "${{ github.run_id }}" \
            --arg run_attempt "${{ github.run_attempt }}" \
            '{
              schema: "full1-gate-summary.v2",
              workflow: $workflow,
              run_id: $run_id,
              run_attempt: $run_attempt,
              jobs: {
                full1_gate3_extended: { result: $gate3_result },
                full1_suite_runners: { result: $suites_result },
                full1_macro_eval: {
                  workflow_result: $macro_eval_workflow_result,
                  artifact_verification: $macro_eval_evidence_result
                },
                full1_plugin_parity: { result: $plugin_result }
              },
              expected_markers: [
                "FULL1_SUITE_MATRIX:PASS",
                "FULL1_MACRO_EVAL_PARITY:PASS",
                "FULL1_PLUGIN_PARITY:PASS"
              ],
              emitted_markers: (
                (if $gate3_result == "success" and $suites_result == "success"
                 then ["FULL1_SUITE_MATRIX:PASS"] else [] end) +
                (if $macro_eval_workflow_result == "success"
                    and $macro_eval_evidence_result == "success"
                 then ["FULL1_MACRO_EVAL_PARITY:PASS"] else [] end) +
                (if $plugin_result == "success"
                 then ["FULL1_PLUGIN_PARITY:PASS"] else [] end)
              )
            }' > .artifacts/full1/full1.summary.json

      - name: Upload Full1 aggregate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full1-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/full1/full1.summary.json
          if-no-files-found: error

      - name: Emit aggregate marker
        run: |
          set -euo pipefail
          gate3_result='${{ needs.full1_gate3_extended.result }}'
          suites_result='${{ needs.full1_suite_runners.result }}'
          macro_eval_workflow_result='${{ needs.full1_macro_eval.result }}'
          macro_eval_evidence_result='${{ steps.validate_macro_eval.outcome }}'
          plugin_result='${{ needs.full1_plugin_parity.result }}'
          echo "full1_gate3_extended=${gate3_result}"
          echo "full1_suite_runners=${suites_result}"
          echo "full1_macro_eval_workflow=${macro_eval_workflow_result}"
          echo "full1_macro_eval_artifact_verification=${macro_eval_evidence_result}"
          echo "full1_plugin_parity=${plugin_result}"
          suite_matrix_ok=0
          macro_eval_ok=0
          plugin_ok=0
          if [ "$gate3_result" = "success" ] && [ "$suites_result" = "success" ]; then
            suite_matrix_ok=1
            echo "FULL1_SUITE_MATRIX:PASS"
          else
            echo "FULL1_SUITE_MATRIX:FAIL" >&2
          fi
          if jq -e '.emitted_markers | index("FULL1_MACRO_EVAL_PARITY:PASS") != null' \
            .artifacts/full1/full1.summary.json >/dev/null; then
            macro_eval_ok=1
            echo "FULL1_MACRO_EVAL_PARITY:PASS"
          else
            echo "FULL1_MACRO_EVAL_PARITY:FAIL" >&2
          fi
          if [ "$plugin_result" = "success" ]; then
            plugin_ok=1
            echo "FULL1_PLUGIN_PARITY:PASS"
          else
            echo "FULL1_PLUGIN_PARITY:FAIL" >&2
          fi
          if [ "$suite_matrix_ok" -eq 1 ] && [ "$macro_eval_ok" -eq 1 ] && [ "$plugin_ok" -eq 1 ]; then
            exit 0
          fi
          exit 1
