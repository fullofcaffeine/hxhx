name: Full1 / Bootstrap-Source Reconciliation

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - .github/workflows/full1-bootstrap-source-reconcile.yml
      - scripts/ci/full1-bootstrap-source-reconcile.js
  schedule:
    - cron: "0 13 * * 6"

# Diagnostic but heavy; cancel stale reruns within the same event/ref lane.
concurrency:
  group: full1-bootstrap-source-reconcile-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "20"
  HAXE_VERSION: "4.3.7"
  # Diagnostic lane follows the same worker policy unless a probe explicitly
  # overrides it for a measured A/B.
  HXHX_DUNE_JOBS: "auto"
  FULL1_RECONCILE_BUILD_TIMEOUT_SECS: "900"
  FULL1_RECONCILE_SUITE_TIMEOUT_SECS: "600"
  FULL1_RECONCILE_ARTIFACTS_DIR: ".artifacts/full1/reconciliation"

jobs:
  bootstrap_build:
    name: Full1 reconcile / build bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install host toolchains (reconciliation build)
        run: |
          set -euo pipefail
          retry_apt() {
            local max_attempts=4
            local attempt=1
            while true; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "APT command failed after ${attempt} attempts: $*" >&2
                return 1
              fi
              echo "APT command failed (attempt ${attempt}/${max_attempts}): $*" >&2
              attempt=$((attempt + 1))
              sleep 5
            done
          }

          retry_apt sudo apt-get update

          dune_candidate="$(apt-cache policy dune | awk '/Candidate:/ { print $2; exit }')"
          if [ -n "${dune_candidate:-}" ] && [ "${dune_candidate}" != "(none)" ]; then
            dune_pkg="dune"
          else
            dune_pkg="ocaml-dune"
          fi

          retry_apt sudo apt-get install -y \
            ocaml "${dune_pkg}" ocaml-findlib \
            neko \
            python3 pypy3 \
            default-jdk \
            build-essential \
            php \
            lua5.4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v5
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          npx lix download
          npx lix download haxe "${{ env.HAXE_VERSION }}"
          npx lix use haxe "${{ env.HAXE_VERSION }}"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version

      - name: Download Haxe libraries (lix)
        run: npx lix download

      - name: Fetch upstream Haxe checkout (vendor/haxe)
        run: bash scripts/vendor/fetch-haxe-upstream.sh

      - name: Build bootstrap lane artifact
        id: build_bootstrap
        continue-on-error: true
        run: |
          set +e
          node scripts/ci/full1-bootstrap-source-reconcile.js \
            --mode build \
            --lane bootstrap \
            --artifacts-dir "${{ env.FULL1_RECONCILE_ARTIFACTS_DIR }}" \
            --build-timeout-secs "${{ env.FULL1_RECONCILE_BUILD_TIMEOUT_SECS }}" &
          build_pid="$!"
          elapsed=0
          while kill -0 "${build_pid}" 2>/dev/null; do
            echo "full1-reconcile bootstrap build heartbeat: pid=${build_pid} elapsed=${elapsed}s"
            sleep 20
            elapsed=$((elapsed + 20))
          done
          wait "${build_pid}"
          build_status="$?"
          echo "build_exit_code=${build_status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload bootstrap build artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full1-reconcile-build-bootstrap-${{ github.run_id }}
          path: |
            .artifacts/full1/reconciliation/bootstrap/build.summary.json
            .artifacts/full1/reconciliation/bootstrap/build.stdout.log
            .artifacts/full1/reconciliation/bootstrap/build.stderr.log
            .artifacts/full1/reconciliation/bootstrap/hxhx
          if-no-files-found: warn

      - name: Fail bootstrap build job if artifact build failed
        if: always()
        run: |
          test "${{ steps.build_bootstrap.outputs.build_exit_code }}" = "0"

  source_build:
    name: Full1 reconcile / build source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install host toolchains (reconciliation build)
        run: |
          set -euo pipefail
          retry_apt() {
            local max_attempts=4
            local attempt=1
            while true; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "APT command failed after ${attempt} attempts: $*" >&2
                return 1
              fi
              echo "APT command failed (attempt ${attempt}/${max_attempts}): $*" >&2
              attempt=$((attempt + 1))
              sleep 5
            done
          }

          retry_apt sudo apt-get update

          dune_candidate="$(apt-cache policy dune | awk '/Candidate:/ { print $2; exit }')"
          if [ -n "${dune_candidate:-}" ] && [ "${dune_candidate}" != "(none)" ]; then
            dune_pkg="dune"
          else
            dune_pkg="ocaml-dune"
          fi

          retry_apt sudo apt-get install -y \
            ocaml "${dune_pkg}" ocaml-findlib \
            neko \
            python3 pypy3 \
            default-jdk \
            build-essential \
            php \
            lua5.4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v5
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          npx lix download
          npx lix download haxe "${{ env.HAXE_VERSION }}"
          npx lix use haxe "${{ env.HAXE_VERSION }}"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version

      - name: Download Haxe libraries (lix)
        run: npx lix download

      - name: Fetch upstream Haxe checkout (vendor/haxe)
        run: bash scripts/vendor/fetch-haxe-upstream.sh

      - name: Build source lane artifact
        id: build_source
        continue-on-error: true
        run: |
          set +e
          node scripts/ci/full1-bootstrap-source-reconcile.js \
            --mode build \
            --lane source \
            --artifacts-dir "${{ env.FULL1_RECONCILE_ARTIFACTS_DIR }}" \
            --build-timeout-secs "${{ env.FULL1_RECONCILE_BUILD_TIMEOUT_SECS }}" &
          build_pid="$!"
          elapsed=0
          while kill -0 "${build_pid}" 2>/dev/null; do
            echo "full1-reconcile source build heartbeat: pid=${build_pid} elapsed=${elapsed}s"
            sleep 20
            elapsed=$((elapsed + 20))
          done
          wait "${build_pid}"
          build_status="$?"
          echo "build_exit_code=${build_status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload source build artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full1-reconcile-build-source-${{ github.run_id }}
          path: |
            .artifacts/full1/reconciliation/source/build.summary.json
            .artifacts/full1/reconciliation/source/build.stdout.log
            .artifacts/full1/reconciliation/source/build.stderr.log
            .artifacts/full1/reconciliation/source/hxhx
          if-no-files-found: warn

      - name: Fail source build job if artifact build failed
        if: always()
        run: |
          test "${{ steps.build_source.outputs.build_exit_code }}" = "0"

  suite_lane_runner:
    name: Full1 reconcile / ${{ matrix.lane }} / ${{ matrix.suite }}
    if: always()
    needs: [bootstrap_build, source_build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: bootstrap
            suite: server
          - lane: bootstrap
            suite: optimization
          - lane: source
            suite: server
          - lane: source
            suite: optimization
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install host toolchains (reconciliation suites)
        run: |
          set -euo pipefail
          retry_apt() {
            local max_attempts=4
            local attempt=1
            while true; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "APT command failed after ${attempt} attempts: $*" >&2
                return 1
              fi
              echo "APT command failed (attempt ${attempt}/${max_attempts}): $*" >&2
              attempt=$((attempt + 1))
              sleep 5
            done
          }

          retry_apt sudo apt-get update

          dune_candidate="$(apt-cache policy dune | awk '/Candidate:/ { print $2; exit }')"
          if [ -n "${dune_candidate:-}" ] && [ "${dune_candidate}" != "(none)" ]; then
            dune_pkg="dune"
          else
            dune_pkg="ocaml-dune"
          fi

          retry_apt sudo apt-get install -y \
            ocaml "${dune_pkg}" ocaml-findlib \
            neko \
            python3 pypy3 \
            default-jdk \
            build-essential \
            php \
            lua5.4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v5
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          npx lix download
          npx lix download haxe "${{ env.HAXE_VERSION }}"
          npx lix use haxe "${{ env.HAXE_VERSION }}"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version

      - name: Download Haxe libraries (lix)
        run: npx lix download

      - name: Fetch upstream Haxe checkout (vendor/haxe)
        run: bash scripts/vendor/fetch-haxe-upstream.sh

      - name: Download lane build artifact
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: full1-reconcile-build-${{ matrix.lane }}-${{ github.run_id }}
          path: .artifacts/full1/reconciliation

      - name: Run lane suite
        run: |
          set -euo pipefail
          if [ -f ".artifacts/full1/reconciliation/${{ matrix.lane }}/hxhx" ]; then
            chmod +x ".artifacts/full1/reconciliation/${{ matrix.lane }}/hxhx"
          fi
          node scripts/ci/full1-bootstrap-source-reconcile.js \
            --mode suite \
            --lane "${{ matrix.lane }}" \
            --suite "${{ matrix.suite }}" \
            --artifacts-dir "${{ env.FULL1_RECONCILE_ARTIFACTS_DIR }}" \
            --suite-timeout-secs "${{ env.FULL1_RECONCILE_SUITE_TIMEOUT_SECS }}" \
            --hxhx-bin ".artifacts/full1/reconciliation/${{ matrix.lane }}/hxhx"

      - name: Upload lane suite artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full1-reconcile-suite-${{ matrix.lane }}-${{ matrix.suite }}-${{ github.run_id }}
          path: |
            .artifacts/full1/reconciliation/${{ matrix.lane }}/${{ matrix.suite }}.run.json
            .artifacts/full1/reconciliation/${{ matrix.lane }}/${{ matrix.suite }}.summary.json
            .artifacts/full1/reconciliation/${{ matrix.lane }}/${{ matrix.suite }}.log
          if-no-files-found: warn

  classify:
    name: Full1 reconcile / classify
    if: always()
    needs: [bootstrap_build, source_build, suite_lane_runner]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download build artifacts
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: full1-reconcile-build-*-${{ github.run_id }}
          path: .artifacts/full1/reconciliation
          merge-multiple: true

      - name: Download suite artifacts
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: full1-reconcile-suite-*-${{ github.run_id }}
          path: .artifacts/full1/reconciliation
          merge-multiple: true

      - name: Classify reconciliation evidence
        run: |
          set -euo pipefail
          node scripts/ci/full1-bootstrap-source-reconcile.js \
            --mode classify \
            --artifacts-dir "${{ env.FULL1_RECONCILE_ARTIFACTS_DIR }}"

      - name: Print reconciliation summary (diagnostic)
        if: always()
        run: |
          if [ -f ".artifacts/full1/reconciliation/bootstrap-source-reconciliation.summary.json" ]; then
            cat ".artifacts/full1/reconciliation/bootstrap-source-reconciliation.summary.json"
          else
            echo "full1-bootstrap-source-reconcile summary missing"
            find .artifacts/full1/reconciliation -maxdepth 3 -type f -print 2>/dev/null || true
          fi

      - name: Upload reconciliation artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full1-bootstrap-source-reconcile-${{ github.run_id }}
          path: |
            .artifacts/full1/reconciliation/bootstrap-source-reconciliation.summary.json
            .artifacts/full1/reconciliation/bootstrap/build.summary.json
            .artifacts/full1/reconciliation/bootstrap/build.stdout.log
            .artifacts/full1/reconciliation/bootstrap/build.stderr.log
            .artifacts/full1/reconciliation/bootstrap/hxhx
            .artifacts/full1/reconciliation/bootstrap/*.run.json
            .artifacts/full1/reconciliation/bootstrap/*.summary.json
            .artifacts/full1/reconciliation/bootstrap/*.log
            .artifacts/full1/reconciliation/source/build.summary.json
            .artifacts/full1/reconciliation/source/build.stdout.log
            .artifacts/full1/reconciliation/source/build.stderr.log
            .artifacts/full1/reconciliation/source/hxhx
            .artifacts/full1/reconciliation/source/*.run.json
            .artifacts/full1/reconciliation/source/*.summary.json
            .artifacts/full1/reconciliation/source/*.log
          if-no-files-found: warn
