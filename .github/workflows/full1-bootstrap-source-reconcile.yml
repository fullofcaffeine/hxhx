name: Full1 / Bootstrap-Source Reconciliation

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - .github/workflows/full1-bootstrap-source-reconcile.yml
      - scripts/ci/full1-bootstrap-source-reconcile.js
  schedule:
    - cron: "0 13 * * 6"

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  HAXE_VERSION: "4.3.7"
  FULL1_RECONCILE_BUILD_TIMEOUT_SECS: "900"
  FULL1_RECONCILE_SUITE_TIMEOUT_SECS: "600"

jobs:
  full1_bootstrap_source_reconcile:
    name: Full1 bootstrap-source reconcile (diagnostic)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host toolchains (reconciliation)
        run: |
          set -euo pipefail
          retry_apt() {
            local max_attempts=4
            local attempt=1
            while true; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "APT command failed after ${attempt} attempts: $*" >&2
                return 1
              fi
              echo "APT command failed (attempt ${attempt}/${max_attempts}): $*" >&2
              attempt=$((attempt + 1))
              sleep 5
            done
          }

          retry_apt sudo apt-get update

          dune_candidate="$(apt-cache policy dune | awk '/Candidate:/ { print $2; exit }')"
          if [ -n "${dune_candidate:-}" ] && [ "${dune_candidate}" != "(none)" ]; then
            dune_pkg="dune"
          else
            dune_pkg="ocaml-dune"
          fi

          retry_apt sudo apt-get install -y \
            ocaml "${dune_pkg}" ocaml-findlib \
            neko \
            python3 pypy3 \
            default-jdk \
            build-essential \
            php \
            lua5.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v4
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          npx lix download
          npx lix download haxe "${{ env.HAXE_VERSION }}"
          npx lix use haxe "${{ env.HAXE_VERSION }}"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version

      - name: Download Haxe libraries (lix)
        run: npx lix download

      - name: Fetch upstream Haxe checkout (vendor/haxe)
        run: bash scripts/vendor/fetch-haxe-upstream.sh

      - name: Launch Full1 bootstrap-source reconciliation (diagnostic)
        run: |
          set -euo pipefail
          mkdir -p .artifacts/full1/reconciliation
          reconcile_pid="$(python3 -c 'import os, subprocess; log_path=\".artifacts/full1/reconciliation/launcher.log\"; log_file=open(log_path, \"ab\", buffering=0); proc=subprocess.Popen([\"node\", \"scripts/ci/full1-bootstrap-source-reconcile.js\", \"--artifacts-dir\", \".artifacts/full1/reconciliation\", \"--build-timeout-secs\", os.environ[\"FULL1_RECONCILE_BUILD_TIMEOUT_SECS\"], \"--suite-timeout-secs\", os.environ[\"FULL1_RECONCILE_SUITE_TIMEOUT_SECS\"]], stdout=log_file, stderr=subprocess.STDOUT, start_new_session=True, close_fds=True); print(proc.pid); log_file.close()')"
          echo "${reconcile_pid}" > .artifacts/full1/reconciliation/reconcile.pid
          echo "full1-bootstrap-source-reconcile launched pid=${reconcile_pid}"

      - name: Wait for Full1 bootstrap-source reconciliation (diagnostic)
        if: always()
        run: |
          set +e
          pid_file=".artifacts/full1/reconciliation/reconcile.pid"
          if [ ! -f "${pid_file}" ]; then
            echo "full1-bootstrap-source-reconcile pid file missing"
            exit 0
          fi
          reconcile_pid="$(cat "${pid_file}")"
          elapsed=0
          max_wait_secs=$((FULL1_RECONCILE_BUILD_TIMEOUT_SECS + 180))
          terminated_for_timeout=0
          while kill -0 "${reconcile_pid}" 2>/dev/null; do
            echo "full1-bootstrap-source-reconcile heartbeat: pid=${reconcile_pid} elapsed=${elapsed}s"
            if [ "${elapsed}" -ge "${max_wait_secs}" ]; then
              echo "full1-bootstrap-source-reconcile exceeded max wait (${max_wait_secs}s); terminating pid=${reconcile_pid}"
              terminated_for_timeout=1
              kill "${reconcile_pid}" 2>/dev/null || true
              sleep 5
              kill -9 "${reconcile_pid}" 2>/dev/null || true
              break
            fi
            sleep 20
            elapsed=$((elapsed + 20))
          done
          if [ "${terminated_for_timeout}" -eq 1 ]; then
            echo "full1-bootstrap-source-reconcile terminated by workflow timeout guard"
          elif kill -0 "${reconcile_pid}" 2>/dev/null; then
            echo "full1-bootstrap-source-reconcile still appears live after polling window"
          else
            echo "full1-bootstrap-source-reconcile no longer running after polling window"
          fi
          exit 0

      - name: Print reconciliation summary (diagnostic)
        if: always()
        run: |
          if [ -f ".artifacts/full1/reconciliation/launcher.log" ]; then
            echo "full1-bootstrap-source-reconcile launcher log tail:"
            tail -n 200 ".artifacts/full1/reconciliation/launcher.log" || true
          else
            echo "full1-bootstrap-source-reconcile launcher log missing"
          fi
          if [ -f ".artifacts/full1/reconciliation/bootstrap-source-reconciliation.summary.json" ]; then
            echo "full1-bootstrap-source-reconcile summary:"
            cat ".artifacts/full1/reconciliation/bootstrap-source-reconciliation.summary.json"
          else
            echo "full1-bootstrap-source-reconcile summary missing"
            find .artifacts/full1/reconciliation -maxdepth 2 -type f -print 2>/dev/null || true
          fi

      - name: Upload reconciliation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full1-bootstrap-source-reconcile-${{ github.run_id }}
          path: |
            .artifacts/full1/reconciliation/bootstrap-source-reconciliation.summary.json
            .artifacts/full1/reconciliation/launcher.log
            .artifacts/full1/reconciliation/reconcile.pid
            .artifacts/full1/reconciliation/bootstrap/*.log
            .artifacts/full1/reconciliation/bootstrap/*.summary.json
            .artifacts/full1/reconciliation/source/*.log
            .artifacts/full1/reconciliation/source/*.summary.json
          if-no-files-found: warn
