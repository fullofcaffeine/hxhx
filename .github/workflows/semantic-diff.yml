name: Stdlib / Semantic Diff

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: "0 7 * * 3"
  workflow_dispatch:

concurrency:
  group: semantic-diff-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  HAXE_VERSION: "4.3.7"

jobs:
  semantic_diff_pr:
    name: Semantic diff (PR smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect semantic-diff scoped changes
        id: scope
        run: |
          set -euo pipefail
          ARTIFACT_DIR=".artifacts/semantic-diff/pr"
          mkdir -p "$ARTIFACT_DIR"

          BASE_SHA=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          HEAD_SHA="${{ github.sha }}"

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            if git rev-parse "${HEAD_SHA}^" >/dev/null 2>&1; then
              BASE_SHA="$(git rev-parse "${HEAD_SHA}^")"
            fi
          fi

          if [ -n "$BASE_SHA" ]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$ARTIFACT_DIR/changed_files.txt"
          else
            git ls-files > "$ARTIFACT_DIR/changed_files.txt"
          fi

          scope_regex='^(packages/reflaxe\.ocaml/std/|packages/reflaxe\.ocaml/src/reflaxe/ocaml/runtimegen/|packages/reflaxe\.ocaml/src/reflaxe/ocaml/OcamlCompiler\.hx|packages/reflaxe\.ocaml/src/reflaxe/ocaml/OcamlRuntimeMode\.hx)'
          if grep -En "$scope_regex" "$ARTIFACT_DIR/changed_files.txt" > "$ARTIFACT_DIR/matched_files.txt"; then
            echo "SEMANTIC_DIFF_LITE_SCOPE:RUN" | tee "$ARTIFACT_DIR/semantic_diff_lite.marker.txt"
            echo "should_run=1" >> "$GITHUB_OUTPUT"
          else
            : > "$ARTIFACT_DIR/matched_files.txt"
            echo "SEMANTIC_DIFF_LITE_SCOPE:SKIP_NO_RELEVANT_CHANGES" | tee "$ARTIFACT_DIR/semantic_diff_lite.marker.txt"
            echo "should_run=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup OCaml toolchain (OCaml 5.2.1)
        if: steps.scope.outputs.should_run == '1'
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.1
          dune-cache: true

      - name: Skip semantic-diff setup (scope unchanged)
        if: steps.scope.outputs.should_run != '1'
        run: echo "Skipping toolchain setup (semantic-diff scope not touched)."

      - name: Install OCaml packages
        if: steps.scope.outputs.should_run == '1'
        run: |
          set -euo pipefail
          eval "$(opam env)"
          opam install -y dune ocamlfind
          eval "$(opam env)"
          dune --version
          ocamlc -version

      - name: Export OCaml switch binaries to PATH
        if: steps.scope.outputs.should_run == '1'
        run: |
          set -euo pipefail
          eval "$(opam env)"
          echo "${OPAM_SWITCH_PREFIX}/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        if: steps.scope.outputs.should_run == '1'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache Haxe toolchain (lix)
        if: steps.scope.outputs.should_run == '1'
        uses: actions/cache@v4
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-

      - name: Install npm dependencies
        if: steps.scope.outputs.should_run == '1'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Haxe (pinned via lix)
        if: steps.scope.outputs.should_run == '1'
        run: |
          set -euo pipefail
          npx lix download
          npx lix download haxe "${{ env.HAXE_VERSION }}"
          npx lix use haxe "${{ env.HAXE_VERSION }}"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version

      - name: Download Haxe libraries (lix)
        if: steps.scope.outputs.should_run == '1'
        run: npx lix download

      - name: Run semantic-diff PR smoke lane
        if: steps.scope.outputs.should_run == '1'
        env:
          SEMANTIC_DIFF_PROFILE: pr
          SEMANTIC_DIFF_SEED: "1337"
          SEMANTIC_DIFF_MAX_PROGRAMS: "50"
          SEMANTIC_DIFF_TIMEOUT_MS: "10000"
          SEMANTIC_DIFF_COMPARATOR_REPEATS: "1"
          SEMANTIC_DIFF_ARTIFACT_DIR: .artifacts/semantic-diff/pr
        run: |
          set -euo pipefail
          bash scripts/test-stdlib-semantic-diff-lane.sh

      - name: Emit semantic-diff-lite pass marker
        if: steps.scope.outputs.should_run == '1'
        run: |
          set -euo pipefail
          echo "SEMANTIC_DIFF_LITE:PASS" | tee -a .artifacts/semantic-diff/pr/semantic_diff_lite.marker.txt

      - name: Emit semantic-diff-lite skip marker
        if: steps.scope.outputs.should_run != '1'
        run: |
          set -euo pipefail
          ARTIFACT_DIR=".artifacts/semantic-diff/pr"
          mkdir -p "$ARTIFACT_DIR"
          echo "SEMANTIC_DIFF_LITE:SKIP_NO_RELEVANT_CHANGES" | tee -a "$ARTIFACT_DIR/semantic_diff_lite.marker.txt"
          printf "Scoped semantic-diff paths were unchanged in this revision.\n" > "$ARTIFACT_DIR/summary.txt"

      - name: Upload semantic-diff PR artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-diff-pr-artifacts
          path: .artifacts/semantic-diff/pr
          if-no-files-found: ignore

  semantic_diff_nightly:
    name: Semantic diff (nightly expanded)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup OCaml toolchain (OCaml 5.2.1)
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.1
          dune-cache: true

      - name: Install OCaml packages
        run: |
          set -euo pipefail
          eval "$(opam env)"
          opam install -y dune ocamlfind
          eval "$(opam env)"
          dune --version
          ocamlc -version

      - name: Export OCaml switch binaries to PATH
        run: |
          set -euo pipefail
          eval "$(opam env)"
          echo "${OPAM_SWITCH_PREFIX}/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v4
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          npx lix download
          npx lix download haxe "${{ env.HAXE_VERSION }}"
          npx lix use haxe "${{ env.HAXE_VERSION }}"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version

      - name: Download Haxe libraries (lix)
        run: npx lix download

      - name: Run semantic-diff nightly expanded lane
        env:
          SEMANTIC_DIFF_PROFILE: nightly
          SEMANTIC_DIFF_SEED: "7331"
          SEMANTIC_DIFF_MAX_PROGRAMS: "1000"
          SEMANTIC_DIFF_TIMEOUT_MS: "15000"
          SEMANTIC_DIFF_COMPARATOR_REPEATS: "2"
          SEMANTIC_DIFF_ARTIFACT_DIR: .artifacts/semantic-diff/nightly
        run: |
          set -euo pipefail
          bash scripts/test-stdlib-semantic-diff-lane.sh

      - name: Emit semantic-diff nightly marker
        run: echo "SEMANTIC_DIFF_NIGHTLY:PASS"

      - name: Upload semantic-diff nightly artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-diff-nightly-artifacts
          path: .artifacts/semantic-diff/nightly
          if-no-files-found: ignore
