              --json-out "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/${{ matrix.suite }}.timings.summary.json" \
              --markdown-out "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/${{ matrix.suite }}.timings.md"
            cat "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/${{ matrix.suite }}.timings.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Full1 suite artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full1-suite-${{ matrix.suite }}-${{ github.run_id }}
          path: |
            .artifacts/full1/suites/${{ matrix.suite }}.log
            .artifacts/full1/suites/${{ matrix.suite }}.summary.json
            .artifacts/full1/suites/${{ matrix.suite }}.timings.jsonl
            .artifacts/full1/suites/${{ matrix.suite }}.timings.summary.json
            .artifacts/full1/suites/${{ matrix.suite }}.timings.md
            .artifacts/full1/suites/generated/${{ matrix.suite }}-*
          if-no-files-found: warn
