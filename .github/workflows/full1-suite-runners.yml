name: Full1 / Suite Runners Strict

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    # Weekly strict suite evidence for Full1 parity closure.
    - cron: "0 9 * * 6"

# Heavy Full1 runs are expensive; cancel stale reruns within the same event/ref lane.
# Include event_name so direct/manual runs do not stomp workflow_call consumers.
concurrency:
  group: full1-suite-runners-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "20"
  HAXE_VERSION: "4.3.7"
  FULL1_SUITE_ARTIFACTS_DIR: ".artifacts/full1/suites"

jobs:
  build_hxhx:
    name: Full1 suite / build hxhx
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host toolchains (Full1 suites build)
        run: |
          set -euo pipefail
          retry_apt() {
            local max_attempts=4
            local attempt=1
            while true; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "APT command failed after ${attempt} attempts: $*" >&2
                return 1
              fi
              echo "APT command failed (attempt ${attempt}/${max_attempts}): $*" >&2
              attempt=$((attempt + 1))
              sleep 5
            done
          }

          retry_apt sudo apt-get update

          dune_candidate="$(apt-cache policy dune | awk '/Candidate:/ { print $2; exit }')"
          if [ -n "${dune_candidate:-}" ] && [ "${dune_candidate}" != "(none)" ]; then
            dune_pkg="dune"
          else
            dune_pkg="ocaml-dune"
          fi

          retry_apt sudo apt-get install -y \
            ocaml "${dune_pkg}" ocaml-findlib \
            neko \
            python3 pypy3 \
            default-jdk \
            build-essential \
            php \
            lua5.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v4
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          npx lix download
          npx lix download haxe "${{ env.HAXE_VERSION }}"
          npx lix use haxe "${{ env.HAXE_VERSION }}"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version

      - name: Download Haxe libraries (lix)
        run: npx lix download

      - name: Prepare shared suite haxelib repo
        run: |
          set -euo pipefail
          phase_start_ms="$(date +%s%3N)"
          set +e
          {
            node scripts/ci/prepare-suite-haxelib-deps.js \
              --repo-path "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/haxelib_repo" \
              --summary-path "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/haxelib_repo.summary.json" \
              --suites "server,display,threads"
          }
          phase_exit="$?"
          set -e
          phase_end_ms="$(date +%s%3N)"
          phase_status="pass"
          if [ "$phase_exit" -ne 0 ]; then
            phase_status="fail"
          fi
          node scripts/ci/full1-phase-timing.js append \
            --jsonl "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/build_hxhx.timings.jsonl" \
            --workflow "full1-suite-runners" \
            --job "build_hxhx" \
            --phase "prepare_haxelib_repo" \
            --started-ms "$phase_start_ms" \
            --ended-ms "$phase_end_ms" \
            --status "$phase_status" \
            --exit-code "$phase_exit"
          exit "$phase_exit"

      - name: Build shared hxhx binary
        run: |
          set -euo pipefail
          phase_start_ms="$(date +%s%3N)"
          set +e
          {
          mkdir -p "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}"
          build_one() {
            local script_path="$1"
            local output_name="$2"
            local stdout_log="$3"
            local stderr_log="$4"
            local build_stdout
            local build_stderr
            local built_path
            build_stdout="$(mktemp)"
            build_stderr="$(mktemp)"
            bash "${script_path}" >"${build_stdout}" 2>"${build_stderr}"
            cat "${build_stderr}"
            built_path="$(awk 'NF { line=$0 } END { print line }' "${build_stdout}")"
            if [ -z "${built_path}" ] || [ ! -f "${built_path}" ]; then
              echo "${script_path} did not produce a valid binary path" >&2
              cat "${build_stdout}" >&2
              exit 1
            fi
            cp "${built_path}" "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/${output_name}"
            chmod +x "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/${output_name}"
            cp "${build_stdout}" "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/${stdout_log}"
            cp "${build_stderr}" "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/${stderr_log}"
          }

          build_one "scripts/hxhx/build-hxhx.sh" "hxhx" "build-hxhx.stdout.log" "build-hxhx.stderr.log"
          }
          phase_exit="$?"
          set -e
          phase_end_ms="$(date +%s%3N)"
          phase_status="pass"
          if [ "$phase_exit" -ne 0 ]; then
            phase_status="fail"
          fi
          node scripts/ci/full1-phase-timing.js append \
            --jsonl "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/build_hxhx.timings.jsonl" \
            --workflow "full1-suite-runners" \
            --job "build_hxhx" \
            --phase "build_hxhx_binary" \
            --started-ms "$phase_start_ms" \
            --ended-ms "$phase_end_ms" \
            --status "$phase_status" \
            --exit-code "$phase_exit"
          exit "$phase_exit"

      - name: Summarize build hxhx timings
        if: always()
        run: |
          set -euo pipefail
          timings="${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/build_hxhx.timings.jsonl"
          if [ -f "$timings" ]; then
            node scripts/ci/full1-phase-timing.js summarize \
              --jsonl "$timings" \
              --json-out "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/build_hxhx.timings.summary.json" \
              --markdown-out "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/build_hxhx.timings.md"
            cat "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/build_hxhx.timings.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload shared hxhx artifact
        uses: actions/upload-artifact@v4
        with:
          name: full1-suite-hxhx-${{ github.run_id }}
          path: |
            .artifacts/full1/suites/hxhx
            .artifacts/full1/suites/haxelib_repo/**
            .artifacts/full1/suites/haxelib_repo.summary.json
            .artifacts/full1/suites/build-hxhx.stdout.log
            .artifacts/full1/suites/build-hxhx.stderr.log
            .artifacts/full1/suites/build_hxhx.timings.jsonl
            .artifacts/full1/suites/build_hxhx.timings.summary.json
            .artifacts/full1/suites/build_hxhx.timings.md
          if-no-files-found: error

  build_macro_host:
    name: Full1 suite / build macro host
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install OCaml toolchain (macro host)
        run: |
          set -euo pipefail
          phase_start_ms="$(date +%s%3N)"
          set +e
          {
          retry_apt() {
            local max_attempts=4
            local attempt=1
            while true; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "APT command failed after ${attempt} attempts: $*" >&2
                return 1
              fi
              echo "APT command failed (attempt ${attempt}/${max_attempts}): $*" >&2
              attempt=$((attempt + 1))
              sleep 5
            done
          }

          retry_apt sudo apt-get update

          dune_candidate="$(apt-cache policy dune | awk '/Candidate:/ { print $2; exit }')"
          if [ -n "${dune_candidate:-}" ] && [ "${dune_candidate}" != "(none)" ]; then
            dune_pkg="dune"
          else
            dune_pkg="ocaml-dune"
          fi

          retry_apt sudo apt-get install -y ocaml "${dune_pkg}" ocaml-findlib
          }
          phase_exit="$?"
          set -e
          phase_end_ms="$(date +%s%3N)"
          phase_status="pass"
          if [ "$phase_exit" -ne 0 ]; then
            phase_status="fail"
          fi
          node scripts/ci/full1-phase-timing.js append \
            --jsonl "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/build_macro_host.timings.jsonl" \
            --workflow "full1-suite-runners" \
            --job "build_macro_host" \
            --phase "install_ocaml_toolchain" \
            --started-ms "$phase_start_ms" \
            --ended-ms "$phase_end_ms" \
            --status "$phase_status" \
            --exit-code "$phase_exit"
          exit "$phase_exit"

      - name: Build macro host binary
        run: |
          set -euo pipefail
          phase_start_ms="$(date +%s%3N)"
          set +e
          {
          mkdir -p "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}"
          build_stdout="$(mktemp)"
          build_stderr="$(mktemp)"
          bash scripts/hxhx/build-hxhx-macro-host.sh >"${build_stdout}" 2>"${build_stderr}"
          cat "${build_stderr}"
          built_path="$(awk 'NF { line=$0 } END { print line }' "${build_stdout}")"
          if [ -z "${built_path}" ] || [ ! -f "${built_path}" ]; then
            echo "scripts/hxhx/build-hxhx-macro-host.sh did not produce a valid binary path" >&2
            cat "${build_stdout}" >&2
            exit 1
          fi
          cp "${built_path}" "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/hxhx-macro-host"
          chmod +x "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/hxhx-macro-host"
          cp "${build_stdout}" "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/build-hxhx-macro-host.stdout.log"
          cp "${build_stderr}" "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/build-hxhx-macro-host.stderr.log"
          }
          phase_exit="$?"
          set -e
          phase_end_ms="$(date +%s%3N)"
          phase_status="pass"
          if [ "$phase_exit" -ne 0 ]; then
            phase_status="fail"
          fi
          node scripts/ci/full1-phase-timing.js append \
            --jsonl "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/build_macro_host.timings.jsonl" \
            --workflow "full1-suite-runners" \
            --job "build_macro_host" \
            --phase "build_macro_host_binary" \
            --started-ms "$phase_start_ms" \
            --ended-ms "$phase_end_ms" \
            --status "$phase_status" \
            --exit-code "$phase_exit"
          exit "$phase_exit"

      - name: Summarize macro host timings
        if: always()
        run: |
          set -euo pipefail
          timings="${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/build_macro_host.timings.jsonl"
          if [ -f "$timings" ]; then
            node scripts/ci/full1-phase-timing.js summarize \
              --jsonl "$timings" \
              --json-out "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/build_macro_host.timings.summary.json" \
              --markdown-out "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/build_macro_host.timings.md"
            cat "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/build_macro_host.timings.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload shared macro host artifact
        uses: actions/upload-artifact@v4
        with:
          name: full1-suite-macro-host-${{ github.run_id }}
          path: |
            .artifacts/full1/suites/hxhx-macro-host
            .artifacts/full1/suites/build-hxhx-macro-host.stdout.log
            .artifacts/full1/suites/build-hxhx-macro-host.stderr.log
            .artifacts/full1/suites/build_macro_host.timings.jsonl
            .artifacts/full1/suites/build_macro_host.timings.summary.json
            .artifacts/full1/suites/build_macro_host.timings.md
          if-no-files-found: error

  full1_suite_runner_inproc:
    name: Full1 suite / ${{ matrix.suite }} (inproc)
    needs: build_hxhx
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        suite: [misc, threads, display]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host toolchains (Full1 suites)
        run: |
          set -euo pipefail
          retry_apt() {
            local max_attempts=4
            local attempt=1
            while true; do
              if "$@"; then
                return 0
