          retry_apt sudo apt-get install -y \
            ocaml "${dune_pkg}" ocaml-findlib \
            neko \
            python3 pypy3 \
            default-jdk \
            build-essential \
            php \
            lua5.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v4
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          npx lix download
          npx lix download haxe "${{ env.HAXE_VERSION }}"
          npx lix use haxe "${{ env.HAXE_VERSION }}"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version

      - name: Download Haxe libraries (lix)
        run: npx lix download

      - name: Fetch upstream Haxe checkout (vendor/haxe)
        run: bash scripts/vendor/fetch-haxe-upstream.sh

      - name: Download shared hxhx artifact
        uses: actions/download-artifact@v4
        with:
          name: full1-suite-hxhx-${{ github.run_id }}
          path: .artifacts/full1/suites

      - name: Run Full1 strict suite
        run: |
          set -euo pipefail
          phase_start_ms="$(date +%s%3N)"
          set +e
          {
          chmod +x "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/hxhx"
          export HAXELIB_PATH="${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/haxelib_repo"
          export HXHX_MACRO_RUNTIME_MODE=inproc
          unset HXHX_MACRO_HOST_EXE
          node scripts/ci/run-upstream-suite.js \
            --suite "${{ matrix.suite }}" \
            --strict \
            --hxhx-bin "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/hxhx" \
            --artifacts-dir "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}"
          }
          phase_exit="$?"
          set -e
          phase_end_ms="$(date +%s%3N)"
          phase_status="pass"
          if [ "$phase_exit" -ne 0 ]; then
            phase_status="fail"
          fi
          node scripts/ci/full1-phase-timing.js append \
            --jsonl "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/${{ matrix.suite }}.timings.jsonl" \
            --workflow "full1-suite-runners" \
            --job "suite-${{ matrix.suite }}-inproc" \
            --phase "suite_run" \
            --detail "suite=${{ matrix.suite }}" \
            --started-ms "$phase_start_ms" \
            --ended-ms "$phase_end_ms" \
            --status "$phase_status" \
            --exit-code "$phase_exit"
          exit "$phase_exit"

      - name: Summarize Full1 suite timings
        if: always()
        run: |
          set -euo pipefail
          timings="${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/${{ matrix.suite }}.timings.jsonl"
          if [ -f "$timings" ]; then
            node scripts/ci/full1-phase-timing.js summarize \
              --jsonl "$timings" \
              --json-out "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/${{ matrix.suite }}.timings.summary.json" \
              --markdown-out "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/${{ matrix.suite }}.timings.md"
            cat "${{ env.FULL1_SUITE_ARTIFACTS_DIR }}/${{ matrix.suite }}.timings.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Full1 suite artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full1-suite-${{ matrix.suite }}-${{ github.run_id }}
          path: |
            .artifacts/full1/suites/${{ matrix.suite }}.log
            .artifacts/full1/suites/${{ matrix.suite }}.summary.json
            .artifacts/full1/suites/${{ matrix.suite }}.timings.jsonl
            .artifacts/full1/suites/${{ matrix.suite }}.timings.summary.json
            .artifacts/full1/suites/${{ matrix.suite }}.timings.md
            .artifacts/full1/suites/generated/${{ matrix.suite }}-*
          if-no-files-found: warn

  full1_suite_runner_external_host:
