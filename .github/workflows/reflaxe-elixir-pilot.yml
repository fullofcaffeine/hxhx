name: Pilot / Reflaxe.Elixir Todo Promotion

on:
  schedule:
    - cron: "17 8 * * 2"
  workflow_dispatch:
    inputs:
      reflaxe_ref:
        description: "External reflaxe.elixir pinned commit SHA"
        required: false
        default: "5b322236e0627f8322394e819cf28ba6c1271a83"
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "20"
  HAXE_VERSION: "4.3.7"

jobs:
  reflaxe_elixir_todo_pilot:
    name: Reflaxe.Elixir todo-app promotion pilot
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup OCaml toolchain (OCaml 5.2.1)
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.1
          dune-cache: true

      - name: Install OCaml packages
        run: |
          set -euo pipefail
          eval "$(opam env)"
          opam install -y dune ocamlfind
          eval "$(opam env)"
          dune --version
          ocamlc -version

      - name: Export OCaml switch binaries to PATH
        run: |
          set -euo pipefail
          eval "$(opam env)"
          echo "${OPAM_SWITCH_PREFIX}/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v4
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          npx lix download
          npx lix download haxe "${{ env.HAXE_VERSION }}"
          npx lix use haxe "${{ env.HAXE_VERSION }}"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version

      - name: Download Haxe libraries (lix)
        run: npx lix download

      - name: Run reflaxe.elixir todo-app promotion pilot
        env:
          REFLAXE_ELIXIR_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.reflaxe_ref || '5b322236e0627f8322394e819cf28ba6c1271a83' }}
          HXHX_PILOT_STRICT: "1"
          HXHX_PILOT_ARTIFACT_DIR: .artifacts/xbnp/reflaxe-elixir-todo-pilot/${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "REFLAXE_ELIXIR_REF=${REFLAXE_ELIXIR_REF}"
          npm run test:hxhx:reflaxe-elixir-todo-pilot

      - name: Upload reflaxe.elixir promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reflaxe-elixir-promotion-native-${{ github.run_id }}
          path: .artifacts/xbnp/reflaxe-elixir-todo-pilot/${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 14
