name: Gate 3 Builtin / Native Target Smoke

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '.beads/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'docs/**'
      - '*.md'
      - '**/*.md'
      - 'bench/**'
      - 'packages/reflaxe.ocaml/examples/build-macro/**'
      - 'packages/reflaxe.ocaml/examples/extlib-pmap/**'
      - 'packages/reflaxe.ocaml/examples/file-io/**'
      - 'packages/reflaxe.ocaml/examples/loop-control/**'
      - 'packages/reflaxe.ocaml/examples/mini-compiler/**'
      - 'packages/reflaxe.ocaml/examples/ocaml-native-collections/**'
      - 'scripts/bench/**'
      - 'scripts/reflaxe-ocaml/**'
      - 'test/packaging/reflaxe_ocaml_external_app/**'
      - 'test/portable/**'
      - 'test/reflaxe_ocaml_tooling_*/**'
      - 'workloads/**'
  pull_request:
    branches: [ master, main ]
    paths-ignore:
      - '.beads/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'docs/**'
      - '*.md'
      - '**/*.md'
      - 'bench/**'
      - 'packages/reflaxe.ocaml/examples/build-macro/**'
      - 'packages/reflaxe.ocaml/examples/extlib-pmap/**'
      - 'packages/reflaxe.ocaml/examples/file-io/**'
      - 'packages/reflaxe.ocaml/examples/loop-control/**'
      - 'packages/reflaxe.ocaml/examples/mini-compiler/**'
      - 'packages/reflaxe.ocaml/examples/ocaml-native-collections/**'
      - 'scripts/bench/**'
      - 'scripts/reflaxe-ocaml/**'
      - 'test/packaging/reflaxe_ocaml_external_app/**'
      - 'test/portable/**'
      - 'test/reflaxe_ocaml_tooling_*/**'
      - 'workloads/**'
  workflow_dispatch:
    inputs:
      reps:
        description: "Number of timing repetitions for delegated vs builtin compare"
        type: string
        required: false
        default: "1"
  schedule:
    # Weekly Linux smoke for linked builtin target path.
    - cron: "0 12 * * 3"

concurrency:
  group: gate3-builtin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "20"
  HAXE_VERSION: "4.3.7"

jobs:
  builtin_target_smoke:
    name: Builtin target smoke (ocaml + js + JS oracle)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup OCaml toolchain (OCaml 5.2.1)
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.1
          dune-cache: true

      - name: Install OCaml packages
        run: |
          set -euo pipefail
          eval "$(opam env)"
          opam install -y dune ocamlfind
          eval "$(opam env)"
          dune --version
          ocamlc -version

      - name: Export OCaml switch binaries to PATH
        run: |
          set -euo pipefail
          eval "$(opam env)"
          echo "${OPAM_SWITCH_PREFIX}/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v5
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          npx lix download
          npx lix download haxe "${{ env.HAXE_VERSION }}"
          npx lix use haxe "${{ env.HAXE_VERSION }}"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version

      - name: Download Haxe libraries (lix)
        run: npx lix download
      - name: Build hxhx once (shared smoke/oracle binary)
        run: |
          set -euo pipefail
          HXHX_BIN="$(bash scripts/hxhx/build-hxhx.sh | tail -n 1)"
          if [ -z "$HXHX_BIN" ] || [ ! -f "$HXHX_BIN" ]; then
            echo "Failed to build hxhx binary for Gate3 builtin lane." >&2
            exit 1
          fi
          echo "HXHX_BIN=$HXHX_BIN" >> "$GITHUB_ENV"

      - name: Run builtin target smoke
        env:
          HXHX_BIN: ${{ env.HXHX_BIN }}
          HXHX_BUILTIN_SMOKE_REPS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.reps || '1' }}
          HXHX_BUILTIN_SMOKE_JS_NATIVE: "1"
          HXHX_BUILTIN_SMOKE_REQUIRE_JS_NATIVE: "1"
        run: |
          set -euo pipefail
          echo "HXHX_BIN=${HXHX_BIN}"
          echo "HXHX_BUILTIN_SMOKE_REPS=${HXHX_BUILTIN_SMOKE_REPS}"
          echo "HXHX_BUILTIN_SMOKE_JS_NATIVE=${HXHX_BUILTIN_SMOKE_JS_NATIVE}"
          echo "HXHX_BUILTIN_SMOKE_REQUIRE_JS_NATIVE=${HXHX_BUILTIN_SMOKE_REQUIRE_JS_NATIVE}"
          npm run test:hxhx:builtin-target-smoke

      - name: Run JS oracle smoke (full scoped fixtures)
        env:
          HXHX_BIN: ${{ env.HXHX_BIN }}
        run: |
          set -euo pipefail
          echo "HXHX_BIN=${HXHX_BIN}"
          npm run test:upstream:js-oracle-smoke
