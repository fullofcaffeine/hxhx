name: Full1 / Eval Native

on:
  workflow_call:
    outputs:
      full1_eval_native_marker:
        description: "Strict native eval marker emitted when the upstream-aligned eval lane passes."
        value: ${{ jobs.full1_eval_native.outputs.full1_eval_native_marker }}
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: full1-eval-native-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "20"
  HAXE_VERSION: "4.3.7"
  FULL1_EVAL_NATIVE_ARTIFACTS_DIR: ".artifacts/full1/eval-native"
  FULL1_EVAL_NATIVE_TIMINGS_JSONL: ".artifacts/full1/eval-native/full1-eval-native.timings.jsonl"

jobs:
  full1_eval_native:
    name: Full1 native eval/interp
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      full1_eval_native_marker: ${{ steps.emit.outputs.full1_eval_native_marker }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host toolchains (Full1 eval native)
        run: |
          set -euo pipefail
          mkdir -p "${FULL1_EVAL_NATIVE_ARTIFACTS_DIR}"
          phase_start_ms="$(date +%s%3N)"
          retry_apt() {
            local max_attempts=4
            local attempt=1
            while true; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "APT command failed after ${attempt} attempts: $*" >&2
                return 1
              fi
              echo "APT command failed (attempt ${attempt}/${max_attempts}): $*" >&2
              attempt=$((attempt + 1))
              sleep 5
            done
          }
          run_phase_body() (
            set -euo pipefail
            retry_apt sudo apt-get update
            dune_candidate="$(apt-cache policy dune | awk '/Candidate:/ { print $2; exit }')"
            if [ -n "${dune_candidate:-}" ] && [ "${dune_candidate}" != "(none)" ]; then
              dune_pkg="dune"
            else
              dune_pkg="ocaml-dune"
            fi
            retry_apt sudo apt-get install -y \
              ocaml "${dune_pkg}" ocaml-findlib \
              python3
          )
          set +e
          run_phase_body
          phase_exit="$?"
          set -e
          phase_end_ms="$(date +%s%3N)"
          phase_status="pass"
          if [ "$phase_exit" -ne 0 ]; then
            phase_status="fail"
          fi
          node scripts/ci/full1-phase-timing.js append \
            --jsonl "$FULL1_EVAL_NATIVE_TIMINGS_JSONL" \
            --workflow "full1-eval-native" \
            --job "full1_eval_native" \
            --phase "install_host_toolchains" \
            --started-ms "$phase_start_ms" \
            --ended-ms "$phase_end_ms" \
            --status "$phase_status" \
            --exit-code "$phase_exit"
          exit "$phase_exit"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v4
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-

      - name: Install npm dependencies
        run: |
          set -euo pipefail
          mkdir -p "${FULL1_EVAL_NATIVE_ARTIFACTS_DIR}"
          phase_start_ms="$(date +%s%3N)"
          set +e
          npm ci --ignore-scripts --no-audit --no-fund
          phase_exit="$?"
          set -e
          phase_end_ms="$(date +%s%3N)"
          phase_status="pass"
          if [ "$phase_exit" -ne 0 ]; then
            phase_status="fail"
          fi
          node scripts/ci/full1-phase-timing.js append \
            --jsonl "$FULL1_EVAL_NATIVE_TIMINGS_JSONL" \
            --workflow "full1-eval-native" \
            --job "full1_eval_native" \
            --phase "install_npm_dependencies" \
            --started-ms "$phase_start_ms" \
            --ended-ms "$phase_end_ms" \
            --status "$phase_status" \
            --exit-code "$phase_exit"
          exit "$phase_exit"

      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          mkdir -p "${FULL1_EVAL_NATIVE_ARTIFACTS_DIR}"
          phase_start_ms="$(date +%s%3N)"
          run_phase_body() (
            set -euo pipefail
            npx lix download
            npx lix download haxe "${{ env.HAXE_VERSION }}"
            npx lix use haxe "${{ env.HAXE_VERSION }}"
            echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
            export PATH="$(pwd)/node_modules/.bin:$PATH"
            haxe -version
          )
          set +e
          run_phase_body
          phase_exit="$?"
          set -e
          phase_end_ms="$(date +%s%3N)"
          phase_status="pass"
          if [ "$phase_exit" -ne 0 ]; then
            phase_status="fail"
          fi
          node scripts/ci/full1-phase-timing.js append \
            --jsonl "$FULL1_EVAL_NATIVE_TIMINGS_JSONL" \
            --workflow "full1-eval-native" \
            --job "full1_eval_native" \
            --phase "install_haxe" \
            --started-ms "$phase_start_ms" \
            --ended-ms "$phase_end_ms" \
            --status "$phase_status" \
            --exit-code "$phase_exit"
          exit "$phase_exit"

      - name: Download Haxe libraries (lix)
        run: |
          set -euo pipefail
          mkdir -p "${FULL1_EVAL_NATIVE_ARTIFACTS_DIR}"
          phase_start_ms="$(date +%s%3N)"
          set +e
          npx lix download
          phase_exit="$?"
          set -e
          phase_end_ms="$(date +%s%3N)"
          phase_status="pass"
          if [ "$phase_exit" -ne 0 ]; then
            phase_status="fail"
          fi
          node scripts/ci/full1-phase-timing.js append \
            --jsonl "$FULL1_EVAL_NATIVE_TIMINGS_JSONL" \
            --workflow "full1-eval-native" \
            --job "full1_eval_native" \
            --phase "download_haxe_libraries" \
            --started-ms "$phase_start_ms" \
            --ended-ms "$phase_end_ms" \
            --status "$phase_status" \
            --exit-code "$phase_exit"
          exit "$phase_exit"

      - name: Fetch upstream Haxe checkout (vendor/haxe)
        run: |
          set -euo pipefail
          mkdir -p "${FULL1_EVAL_NATIVE_ARTIFACTS_DIR}"
          phase_start_ms="$(date +%s%3N)"
          set +e
          bash scripts/vendor/fetch-haxe-upstream.sh
          phase_exit="$?"
          set -e
          phase_end_ms="$(date +%s%3N)"
          phase_status="pass"
          if [ "$phase_exit" -ne 0 ]; then
            phase_status="fail"
          fi
          node scripts/ci/full1-phase-timing.js append \
            --jsonl "$FULL1_EVAL_NATIVE_TIMINGS_JSONL" \
            --workflow "full1-eval-native" \
            --job "full1_eval_native" \
            --phase "fetch_upstream_haxe" \
            --started-ms "$phase_start_ms" \
            --ended-ms "$phase_end_ms" \
            --status "$phase_status" \
            --exit-code "$phase_exit"
          exit "$phase_exit"

      - name: Build shared hxhx binary
        run: |
          set -euo pipefail
          mkdir -p "${FULL1_EVAL_NATIVE_ARTIFACTS_DIR}"
          phase_start_ms="$(date +%s%3N)"
          run_phase_body() (
            set -euo pipefail
            HXHX_STAGE0_PREFER_NATIVE=1 HXHX_STAGE0_OCAML_BUILD=native bash scripts/hxhx/build-hxhx.sh | tee "${FULL1_EVAL_NATIVE_ARTIFACTS_DIR}/build-hxhx.stdout.log"
            phase_exit="${PIPESTATUS[0]}"
            if [ "$phase_exit" -ne 0 ]; then
              exit "$phase_exit"
            fi
            HXHX_BIN="$(tail -n 1 "${FULL1_EVAL_NATIVE_ARTIFACTS_DIR}/build-hxhx.stdout.log")"
            if [ ! -x "${HXHX_BIN}" ] && [ ! -f "${HXHX_BIN}" ]; then
              echo "Resolved HXHX_BIN does not exist: ${HXHX_BIN}" >&2
              exit 1
            fi
            echo "HXHX_BIN=${HXHX_BIN}" >> "$GITHUB_ENV"
          )
          set +e
          run_phase_body
          phase_exit="$?"
          set -e
          phase_end_ms="$(date +%s%3N)"
          phase_status="pass"
          if [ "$phase_exit" -ne 0 ]; then
            phase_status="fail"
          fi
          node scripts/ci/full1-phase-timing.js append \
            --jsonl "$FULL1_EVAL_NATIVE_TIMINGS_JSONL" \
            --workflow "full1-eval-native" \
            --job "full1_eval_native" \
            --phase "build_hxhx_binary" \
            --started-ms "$phase_start_ms" \
            --ended-ms "$phase_end_ms" \
            --status "$phase_status" \
            --exit-code "$phase_exit"
          if [ "$phase_exit" -ne 0 ]; then
            exit "$phase_exit"
          fi

      - name: Run Full1 native eval/interp runner
        run: |
          set -euo pipefail
          mkdir -p "${FULL1_EVAL_NATIVE_ARTIFACTS_DIR}"
          phase_start_ms="$(date +%s%3N)"
          set +e
          node scripts/ci/run-full1-eval-native.js
          phase_exit="$?"
          set -e
          phase_end_ms="$(date +%s%3N)"
          phase_status="pass"
          if [ "$phase_exit" -ne 0 ]; then
            phase_status="fail"
          fi
          node scripts/ci/full1-phase-timing.js append \
            --jsonl "$FULL1_EVAL_NATIVE_TIMINGS_JSONL" \
            --workflow "full1-eval-native" \
            --job "full1_eval_native" \
            --phase "native_eval_runner" \
            --started-ms "$phase_start_ms" \
            --ended-ms "$phase_end_ms" \
            --status "$phase_status" \
            --exit-code "$phase_exit"
          exit "$phase_exit"

      - name: Summarize Full1 eval native timings
        if: always()
        run: |
          set -euo pipefail
          timings="$FULL1_EVAL_NATIVE_TIMINGS_JSONL"
          if [ -f "$timings" ]; then
            node scripts/ci/full1-phase-timing.js summarize \
              --jsonl "$timings" \
              --json-out "${FULL1_EVAL_NATIVE_ARTIFACTS_DIR}/full1-eval-native.timings.summary.json" \
              --markdown-out "${FULL1_EVAL_NATIVE_ARTIFACTS_DIR}/full1-eval-native.timings.md"
            cat "${FULL1_EVAL_NATIVE_ARTIFACTS_DIR}/full1-eval-native.timings.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Full1 eval native artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full1-eval-native-${{ github.run_id }}
          path: .artifacts/full1/eval-native
          if-no-files-found: error

      - name: Emit Full1 eval native marker
        id: emit
        run: |
          set -euo pipefail
          echo "FULL1_EVAL_NATIVE:PASS"
          echo "full1_eval_native_marker=FULL1_EVAL_NATIVE:PASS" >> "$GITHUB_OUTPUT"
